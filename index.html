var MAPCFG = {
  base:'satelit',
  show:{bidang:1, pos:1, live:1, cctv:1, label:1},
  view:null,           // {lat,lng,zoom} — dipertahankan antar-render
  ikut:false           // ikuti posisi sendiri secara otomatis saat berbagi lokasi
};

function pusatAwal(){
  if(MAPCFG.view) return MAPCFG.view;
  var la = Number(S.settings.petaLat), ln = Number(S.settings.petaLng);
  var zm = Math.min(Number(S.settings.petaZoom) || 18, ZOOM_MAKS);
  if(!isFinite(la) || !isFinite(ln) || (la===0 && ln===0)){
    /* jatuhkan ke bidang atau pos pertama yang punya koordinat */
    var ref = (S.bidang||[]).map(function(b){ var r=parseRing(b.geojson); return r?pusatRing(r):null; })
                .filter(Boolean)[0]
           || (S.patroli||[]).filter(function(p){ return p.lat && p.lng; })
                .map(function(p){ return [p.lat, p.lng]; })[0];
    if(ref) return {lat:ref[0], lng:ref[1], zoom:zm};
    return {lat:-6.9034, lng:107.6181, zoom:16};
  }
  return {lat:la, lng:ln, zoom:zm};
}

function pasangPeta(){
  var el = $('petaRT');
  if(!el) return;

  ensureLeaflet().then(function(){
    if(!$('petaRT')) return;                 // pengguna sudah pindah tab
    el.innerHTML = '';
    var v = pusatAwal();

    MAP.inst = L.map('petaRT', {
      center:[v.lat, v.lng], zoom:Math.min(v.zoom, ZOOM_MAKS),
      zoomControl:true, attributionControl:true,
      maxZoom:ZOOM_MAKS, zoomSnap:0.5, zoomDelta:0.5, wheelPxPerZoomLevel:80
    });
    MAP.siap = true; MAP.gagal = false;

    terapkanBasemap();

    MAP.layer.bidang = L.layerGroup().addTo(MAP.inst);
    MAP.layer.pos    = L.layerGroup().addTo(MAP.inst);
    MAP.layer.cctv   = L.layerGroup().addTo(MAP.inst);
    MAP.layer.live   = L.layerGroup().addTo(MAP.inst);
    MAP.layer.draft  = L.layerGroup().addTo(MAP.inst);

    MAP.inst.on('click', petaDiklik);
    MAP.inst.on('moveend zoomend', function(){
      var c = MAP.inst.getCenter();
      MAPCFG.view = {lat:c.lat, lng:c.lng, zoom:MAP.inst.getZoom()};
    });

    /* Geseran manual mematikan mode ikut otomatis, supaya peta tidak
       "melawan" pengguna yang sedang melihat area lain. */
    MAP.inst.on('dragstart', function(){
      if(MAPCFG.ikut){ MAPCFG.ikut = false; perbaruiTombolIkut(); }
    });

    gambarBidangSemua();
    gambarPos();
    gambarCctvPin();
    gambarLive();
    terapkanVisibilitas();

    setTimeout(function(){ if(MAP.inst) MAP.inst.invalidateSize(); }, 120);
  }).catch(function(err){
    MAP.gagal = true;
    if(!$('petaRT')) return;
    el.className = 'mapfallback';
    el.innerHTML = '<div class="mapnote warn" style="margin:0">🛰️ '+esc(err.message)+
      ' Denah sederhana ditampilkan sebagai gantinya.</div>'+ denahCadangan();
  });
}

/** Denah kotak-kotak tanpa internet — pengganti peta saat offline. */
function denahCadangan(){
  var out = '';
  S.patroli.forEach(function(p){
    var bg = p.status==='Lengkap - Aman'?'#bbf7d0':p.status==='Sedang Dipatroli'?'#fde047':'#fecaca';
    out += '<div class="pin" style="left:'+(Number(p.xPercent)||50)+'%;top:'+(Number(p.yPercent)||50)+'%;'+
      'background:'+bg+'" title="'+esc(p.namaPos)+'">'+esc(String(p.kodePos||'').slice(-2))+'</div>';
  });
  return out;
}

function lepasPeta(){
  if(MAP.inst){
    try{ MAP.inst.off(); MAP.inst.remove(); }catch(e){}
  }
  MAP.inst = null; MAP.layer = {}; MAP.siap = false;
  MAP.mode = 'lihat'; MAP.draft = [];
}

function terapkanBasemap(){
  if(!MAP.inst) return;
  var d = basemapDefs()[MAPCFG.base] || basemapDefs().jalan;
  if(MAP.base){ try{ MAP.inst.removeLayer(MAP.base); }catch(e){} }
  MAP.base = L.tileLayer(d.url, d.opt).addTo(MAP.inst);
  MAP.base.bringToBack();
}

function gantiBasemap(k){
  MAPCFG.base = k;
  terapkanBasemap();
}

/** Satu tombol lapisan. Tanda ● berarti sedang tampil, ○ berarti disembunyikan. */
function chipLapisan(k, label, judul){
  var on = !!MAPCFG.show[k];
  return '<button class="chip'+(on?' on':'')+'" id="chip_'+k+'" '+
    'title="'+esc(judul)+'" aria-pressed="'+(on?'true':'false')+'" '+
    'onclick="toggleLapisan(\''+jsq(k)+'\')">'+(on?'●':'○')+' '+esc(label)+'</button>';
}

function toggleLapisan(k){
  MAPCFG.show[k] = MAPCFG.show[k] ? 0 : 1;
  if(k === 'label'){ gambarBidangSemua(); }
  terapkanVisibilitas();

  /* perbarui tampilan tombol tanpa membangun ulang peta */
  var el = $('chip_'+k);
  if(el){
    var on = !!MAPCFG.show[k];
    el.className = 'chip'+(on?' on':'');
    el.setAttribute('aria-pressed', on?'true':'false');
    el.textContent = (on?'●':'○') + ' ' + el.textContent.replace(/^[●○]\s*/, '');
  }
}

function terapkanVisibilitas(){
  if(!MAP.inst) return;
  [['bidang','bidang'],['pos','pos'],['live','live'],['cctv','cctv']].forEach(function(pair){
    var lay = MAP.layer[pair[1]];
    if(!lay) return;
    if(MAPCFG.show[pair[0]]){ if(!MAP.inst.hasLayer(lay)) MAP.inst.addLayer(lay); }
    else { if(MAP.inst.hasLayer(lay)) MAP.inst.removeLayer(lay); }
  });
}

/* ---------- bidang persil ---------- */
function warnaJenis(b){
  if(b.warna) return b.warna;
  if(/ibadah|musholla|masjid/i.test(b.jenis)) return '#8b5cf6';
  if(/fasilitas|fasum|umum/i.test(b.jenis))   return '#f97316';
  return '#22c55e';
}

function gambarBidangSemua(){
  if(!MAP.layer.bidang) return;
  MAP.layer.bidang.clearLayers();

  (S.bidang||[]).forEach(function(b){
    var ring = parseRing(b.geojson);
    if(!ring) return;
    var warna = warnaJenis(b);

    var poly = L.polygon(ring, {
      color:'#000000', weight:2, opacity:1,
      fillColor:warna, fillOpacity:0.45
    });

    if(MAPCFG.show.label && b.noRumah){
      poly.bindTooltip(String(b.noRumah), {
        permanent:true, direction:'center', className:'lbl-bidang'+(b.wargaId?'':' fasum'), opacity:1
      });
    }

    poly.on('click', function(e){
      if(MAP.mode === 'gambar') return;      // sedang menggambar, jangan buka popup
      if(e.originalEvent) L.DomEvent.stopPropagation(e);
      poly.bindPopup(popupBidang(b), {maxWidth:280}).openPopup(e.latlng);
    });

    poly._bidangId = b.id;
    MAP.layer.bidang.addLayer(poly);
  });
}

function popupBidang(b){
  var w = S.warga.filter(function(x){ return x.id === b.wargaId; })[0];
  var h = '<div style="min-width:190px">'+
    '<div style="font-weight:900;font-size:14px">'+esc(b.blok||'')+' '+esc(b.noRumah||'')+'</div>'+
    '<div style="font-size:11px;color:#64748b;margin-bottom:6px">'+esc(b.jenis)+' • '+esc(luasTeks(b.luas))+'</div>';

  if(w){
    h += '<div style="display:flex;gap:8px;align-items:center;margin:8px 0">'+
           avatarHtml(w.nama, w.fotoUrl)+
           '<div><b style="font-size:12.5px">'+esc(w.nama)+'</b>'+
           '<div style="font-size:11px;color:#64748b">'+esc(w.statusHunian||'')+' • '+num(w.jumlahAnggota)+' jiwa</div></div>'+
         '</div>'+
         '<div style="font-size:11.5px">📞 '+esc(w.noHp||'-')+'</div>';
    var tunggak = S.iuran.filter(function(i){ return i.wargaId===w.id && i.status!=='Lunas'; }).length;
    if(tunggak) h += '<div style="font-size:11.5px;margin-top:4px;color:#b91c1c;font-weight:800">⚠️ '+tunggak+' tagihan belum lunas</div>';
    h += '<div style="margin-top:8px"><button class="btn sm" onclick="kartuWarga(\''+jsq(w.id)+'\')">Kartu Warga</button></div>';
  }else{
    h += '<div style="font-size:11.5px;color:#64748b">'+esc(b.wargaNama||'Belum ditautkan ke data warga.')+'</div>';
  }

  if(b.catatan) h += '<div style="font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid #e2e8f0">'+esc(b.catatan)+'</div>';
  if(isPengurus()){
    h += '<div style="margin-top:8px;display:flex;gap:5px">'+
         '<button class="btn sm blue" onclick="formBidang(\''+jsq(b.id)+'\')">Edit</button>'+
         '<button class="btn sm red" onclick="hapusBidang(\''+jsq(b.id)+'\')">Hapus</button></div>';
  }
  return h + '</div>';
}

function zoomKeBidang(id){
  var b = (S.bidang||[]).filter(function(x){ return x.id===id; })[0];
  var ring = b && parseRing(b.geojson);
  if(!ring){ toast('Bidang ini belum punya geometri.','info'); return; }
  if(!MAP.inst){ toast('Peta belum siap.','info'); return; }
  MAP.inst.fitBounds(L.polygon(ring).getBounds(), {maxZoom:ZOOM_BIDANG, padding:[40,40]});
  var el = $('petaRT'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  MAP.layer.bidang.eachLayer(function(l){
    if(l._bidangId === id) setTimeout(function(){ l.bindPopup(popupBidang(b)).openPopup(); }, 400);
  });
}

/* ---------- pos jaga & CCTV di peta ---------- */
function gambarPos(){
  if(!MAP.layer.pos) return;
  MAP.layer.pos.clearLayers();
  S.patroli.forEach(function(p){
    if(!p.lat || !p.lng) return;
    var bg = p.status==='Lengkap - Aman'?'#bbf7d0':p.status==='Sedang Dipatroli'?'#fde047':'#fecaca';
    var ic = L.divIcon({
      className:'', iconSize:[30,30], iconAnchor:[15,15],
      html:'<div class="mk" style="background:'+bg+'">🛡️</div>'
    });
    L.marker([p.lat, p.lng], {icon:ic})
      .bindPopup('<b>'+esc(p.namaPos)+'</b><div style="font-size:11.5px;margin-top:4px">'+
        esc(p.kodePos)+' • '+esc(p.status)+'<br>Petugas: '+esc(p.petugasNama)+
        '<br>Terakhir: '+esc(p.jamPatroliTerakhir)+'</div>'+
        '<div style="margin-top:6px"><button class="btn sm dark" onclick="checkinPatroli(\''+jsq(p.id)+'\')">Check-in</button></div>')
      .addTo(MAP.layer.pos);
  });
}

function gambarCctvPin(){
  if(!MAP.layer.cctv) return;
  MAP.layer.cctv.clearLayers();
  (S.cctv||[]).forEach(function(c){
    if(!c.lat || !c.lng) return;
    if(!c.publik && !isPengurus()) return;
    var mati = c.status !== 'Aktif';
    var ic = L.divIcon({
      className:'', iconSize:[30,30], iconAnchor:[15,15],
      html:'<div class="mk" style="background:'+(mati?'#e2e8f0':'#bfdbfe')+'">📹</div>'
    });
    L.marker([c.lat, c.lng], {icon:ic})
      .bindPopup('<b>'+esc(c.nama)+'</b><div style="font-size:11.5px;margin-top:4px">'+
        esc(c.lokasi||'')+'<br>Status: '+esc(c.status)+'</div>'+
        '<div style="margin-top:6px"><button class="btn sm dark" onclick="go(\'cctv\')">Buka CCTV</button></div>')
      .addTo(MAP.layer.cctv);
  });
}

/* ---------- menggambar bidang baru ---------- */
function gambarBidangMulai(){
  if(!isPengurus()){ toast('Hanya pengurus yang dapat memetakan bidang.','err'); return; }
  if(!MAP.inst){ toast('Peta belum siap — tunggu sebentar atau periksa koneksi.','err'); return; }
  MAP.mode = 'gambar'; MAP.draft = [];
  $('petaRT').classList.add('drawing');
  perbaruiBarGambar();
  toast('Ketuk peta mengikuti batas bidang. Minimal 3 titik.','info');
}

function petaDiklik(e){
  if(MAP.mode !== 'gambar') return;
  MAP.draft.push([e.latlng.lat, e.latlng.lng]);
  gambarDraft();
  perbaruiBarGambar();
}

function gambarDraft(){
  if(!MAP.layer.draft) return;
  MAP.layer.draft.clearLayers();
  if(!MAP.draft.length) return;

  if(MAP.draft.length >= 3){
    L.polygon(MAP.draft, {color:'#ef4444', weight:2, dashArray:'6,4',
      fillColor:'#ef4444', fillOpacity:0.25}).addTo(MAP.layer.draft);
  }else if(MAP.draft.length === 2){
    L.polyline(MAP.draft, {color:'#ef4444', weight:2, dashArray:'6,4'}).addTo(MAP.layer.draft);
  }
  MAP.draft.forEach(function(pt, i){
    L.circleMarker(pt, {radius:6, color:'#000', weight:2, fillColor:'#fde047', fillOpacity:1})
      .bindTooltip(String(i+1), {permanent:true, direction:'top', className:'lbl-bidang'})
      .addTo(MAP.layer.draft);
  });
}

function perbaruiBarGambar(){
  var bar = $('drawBar');
  if(!bar) return;
  if(MAP.mode !== 'gambar'){ bar.innerHTML = ''; return; }
  var luas = MAP.draft.length >= 3 ? luasRing(MAP.draft) : 0;
  bar.innerHTML = '<div class="mapnote">✏️ Mode menggambar aktif — '+MAP.draft.length+' titik'+
    (luas ? ' • perkiraan luas '+esc(luasTeks(luas)) : ' (butuh minimal 3 titik)')+
    '<div class="row" style="margin-top:7px">'+
      '<button class="btn sm dark" onclick="gambarSelesai()"'+(MAP.draft.length<3?' disabled':'')+'>✔ Selesai &amp; Isi Data</button>'+
      '<button class="btn sm" onclick="gambarUndo()"'+(MAP.draft.length?'':' disabled')+'>↶ Hapus Titik Terakhir</button>'+
      '<button class="btn sm red" onclick="gambarBatal()">✕ Batal</button>'+
    '</div></div>';
}

function gambarUndo(){ MAP.draft.pop(); gambarDraft(); perbaruiBarGambar(); }

function gambarBatal(){
  MAP.mode = 'lihat'; MAP.draft = [];
  if(MAP.layer.draft) MAP.layer.draft.clearLayers();
  var el = $('petaRT'); if(el) el.classList.remove('drawing');
  perbaruiBarGambar();
}

function gambarSelesai(){
  if(MAP.draft.length < 3){ toast('Butuh minimal 3 titik.','err'); return; }
  var ring = MAP.draft.slice();
  gambarBatal();
  formBidang(null, ring);
}

/* ---------- formulir bidang ---------- */
function opsiWarga(){
  var out = [{v:'', l:'— tidak ditautkan (fasum / lahan kosong) —'}];
  (S.warga||[]).slice().sort(function(a,b){
    return (a.blok+a.noRumah).localeCompare(b.blok+b.noRumah);
  }).forEach(function(w){
    out.push({v:w.id, l:w.nama+' — '+w.blok+' '+w.noRumah});
  });
  return out;
}

function formBidang(id, ringBaru){
  if(!isPengurus()){ toast('Hanya pengurus yang dapat mengubah bidang.','err'); return; }
  var b = id ? (S.bidang||[]).filter(function(x){return x.id===id;})[0] : null;
  var ring = ringBaru || (b ? parseRing(b.geojson) : null);
  if(!ring){ toast('Geometri bidang tidak ditemukan.','err'); return; }

  var luas = Math.round(luasRing(ring));
  var init = b ? JSON.parse(JSON.stringify(b)) : {jenis:'Rumah Warga', warna:'#22c55e'};
  init.luas = luas;

  formModal(b ? 'Edit Bidang — '+(b.noRumah||b.kode||'') : 'Bidang Baru ('+luasTeks(luas)+')', [
    {k:'wargaId', l:'Tautkan ke Warga', t:'select', optv:opsiWarga(),
     help:'Nomor rumah & blok akan mengikuti data warga bila dikosongkan.'},
    {k:'noRumah', l:'Nomor Rumah (tampil sebagai label di peta)', t:'text', ph:'No. 12'},
    {k:'blok',    l:'Blok', t:'text', ph:'Blok A1'},
    {k:'kode',    l:'Kode Bidang / NIB', t:'text', ph:'A1-12'},
    {k:'jenis',   l:'Jenis Bidang', t:'select',
     opt:['Rumah Warga','Rumah Kontrakan','Fasilitas Umum','Tempat Ibadah','Lahan Kosong','Jalan & Saluran','Lainnya']},
    {k:'warna',   l:'Warna di Peta', t:'color'},
    {k:'luas',    l:'Luas (m²)', t:'number', help:'Terisi otomatis dari geometri; boleh dikoreksi manual.'},
    {k:'catatan', l:'Catatan', t:'textarea'}
  ], init, function(v){
    v.geojson = JSON.stringify(ring);
    var w = (S.warga||[]).filter(function(x){ return x.id === v.wargaId; })[0];
    if(w){
      v.wargaNama = w.nama;
      if(!v.noRumah) v.noRumah = w.noRumah;
      if(!v.blok)    v.blok    = w.blok;
    }else{
      v.wargaNama = '';
    }
    if(b){ v.id = b.id; mutate('bidang_update', v, {okMsg:'Bidang diperbarui.'}).then(render).catch(function(){}); }
    else  { mutate('bidang_add', v, {okMsg:'Bidang tersimpan.'}).then(render).catch(function(){}); }
  }, true);
}

function hapusBidang(id){
  var b = (S.bidang||[]).filter(function(x){return x.id===id;})[0];
  konfirmasi('Hapus bidang "'+((b&&(b.noRumah||b.kode))||id)+'" dari peta?', function(){
    mutate('bidang_delete', {id:id, noRumah:b?b.noRumah:''}, {okMsg:'Bidang dihapus.'}).then(render).catch(function(){});
  });
}

/* ---------- utilitas peta ---------- */
function petaKeLokasiSaya(){
  if(!navigator.geolocation){ toast('Perangkat ini tidak mendukung GPS.','err'); return; }
  toast('Mencari posisi GPS…','info');
  navigator.geolocation.getCurrentPosition(function(pos){
    var la = pos.coords.latitude, ln = pos.coords.longitude;
    if(MAP.inst){
      MAP.inst.setView([la, ln], ZOOM_GPS);
      L.circleMarker([la, ln], {radius:8, color:'#000', weight:2, fillColor:'#3b82f6', fillOpacity:1})
        .bindPopup('Posisi Anda<br><span style="font-size:11px">±'+Math.round(pos.coords.accuracy)+' m</span>')
        .addTo(MAP.inst).openPopup();
    }
    toast('Posisi ditemukan (±'+Math.round(pos.coords.accuracy)+' m).','ok');
  }, function(err){
    toast('GPS gagal: '+pesanGeo(err),'err');
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
}

function simpanTampilanPeta(){
  if(!MAP.inst){ toast('Peta belum siap.','err'); return; }
  var c = MAP.inst.getCenter();
  mutate('settings_update', {
    petaLat:String(c.lat.toFixed(6)), petaLng:String(c.lng.toFixed(6)),
    petaZoom:String(MAP.inst.getZoom()), petaBasemap:MAPCFG.base
  }, {okMsg:'Tampilan awal peta disimpan.'}).catch(function(){});
}

function setKoordinatPos(id){
  if(!navigator.geolocation){ toast('Perangkat ini tidak mendukung GPS.','err'); return; }
  var p = S.patroli.filter(function(x){return x.id===id;})[0];
  toast('Membaca GPS…','info');
  navigator.geolocation.getCurrentPosition(function(pos){
    konfirmasi('Pindahkan pin pos "'+(p?p.namaPos:id)+'" ke posisi Anda sekarang '+
      '('+pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6)+')?', function(){
      mutate('patroli_checkin', {
        id:id, lat:pos.coords.latitude, lng:pos.coords.longitude,
        status:(p?p.status:'Lengkap - Aman'), petugasNama:(p?p.petugasNama:''), catatan:(p?p.catatan:'')
      }, {okMsg:'Koordinat pos diperbarui.'}).then(render).catch(function(){});
    });
  }, function(err){ toast('GPS gagal: '+pesanGeo(err),'err'); },
     {enableHighAccuracy:true, timeout:15000});
}

function pesanGeo(err){
  if(!err) return 'tidak diketahui';
  if(err.code === 1) return 'izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan peramban.';
  if(err.code === 2) return 'posisi tidak tersedia. Pastikan GPS menyala dan Anda berada di area terbuka.';
  if(err.code === 3) return 'waktu tunggu habis. Coba lagi di area yang lebih terbuka.';
  return err.message || 'tidak diketahui';
}

/** Perbesar peta ke tingkat paling rinci pada titik yang sedang dilihat. */
function zoomMaks(){
  if(!MAP.inst){ toast('Peta belum siap.','err'); return; }
  MAP.inst.setZoom(ZOOM_MAKS);
  toast('Perbesaran maksimum. Di atas level 19 gambar ubin dibesarkan, jadi tampak melunak.','info');
}

function toggleIkut(){
  MAPCFG.ikut = !MAPCFG.ikut;
  perbaruiTombolIkut();
  if(MAPCFG.ikut){
    if(!LIVE.sesiId){
      toast('Aktifkan “Mulai Berbagi Lokasi” dulu agar posisi Anda terbaca.','info');
    }else if(LIVE.lastPos && MAP.inst){
      MAP.inst.setView(LIVE.lastPos, Math.max(MAP.inst.getZoom(), ZOOM_IKUT));
    }
  }
}

function perbaruiTombolIkut(){
  var el = $('chipIkut');
  if(!el) return;
  el.className = 'chip' + (MAPCFG.ikut ? ' on' : '');
  el.textContent = (MAPCFG.ikut ? '●' : '○') + ' Ikuti Posisi Saya';
}

/* ============================================================
 * 8c. PELACAKAN PATROLI LANGSUNG
 * ============================================================ */
var PING_JEDA_MS = 12000;   // kirim maksimal tiap 12 detik
var PING_JARAK_M = 12;      // atau bila sudah bergerak 12 meter
var POLL_JEDA_MS = 10000;   // warga menarik data tiap 10 detik

function mulaiBerbagiLokasi(){
  if(!navigator.geolocation){ toast('Perangkat ini tidak mendukung GPS.','err'); return; }
  if(!S.online){ toast('Berbagi lokasi memerlukan koneksi internet.','err'); return; }
  if(LIVE.sesiId){ toast('Lokasi Anda sudah dibagikan.','info'); return; }

  var namaAwal = (S.me && S.me.nama) ? S.me.nama : '';
  formModal('Mulai Berbagi Lokasi Patroli', [
    {k:'petugasNama', l:'Nama Petugas', t:'text', req:true},
    {k:'kodePos', l:'Rute / Pos yang Dijaga', t:'text', ph:'Rute Blok A–C'},
    {k:'catatan', l:'Catatan Shift', t:'text', ph:'Shift malam 22.00–04.00'}
  ], {petugasNama:namaAwal}, function(v){
    v.deviceId = deviceId();
    callServer('patroli_sesi_start', v).then(function(sesi){
      LIVE.sesiId = sesi.id;
      LIVE.lastKirim = 0; LIVE.lastPos = null; LIVE.kirimGagal = 0;
      simpanSesiLokal(sesi.id);
      MAPCFG.ikut = true;          // saat patroli, peta mengikuti petugas
      pasangWatch();
      toast('Lokasi Anda mulai dibagikan. Peta akan mengikuti posisi Anda.','ok');
      render();
    }).catch(function(err){ toast(err.message,'err'); });
  });
}

function pasangWatch(){
  if(LIVE.watch !== null && LIVE.watch !== undefined) return;
  LIVE.watch = navigator.geolocation.watchPosition(function(pos){
    kirimPing(pos);
  }, function(err){
    toast('GPS: '+pesanGeo(err),'err');
    if(err.code === 1) hentikanBerbagiLokasi();
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:3000});
}

function kirimPing(pos){
  if(!LIVE.sesiId) return;
  var la = pos.coords.latitude, ln = pos.coords.longitude;
  var kini = Date.now();
  var jauh = LIVE.lastPos ? jarakMeter(LIVE.lastPos, [la, ln]) : 1e9;

  if(kini - LIVE.lastKirim < PING_JEDA_MS && jauh < PING_JARAK_M) return;
  if(!S.online) return;

  LIVE.lastKirim = kini;
  LIVE.lastPos = [la, ln];

  /* Ikuti posisi sendiri: geser peta dan perbesar bila masih terlalu jauh. */
  if(MAPCFG.ikut && MAP.inst && S.tab === 'patrol'){
    MAP.inst.setView([la, ln], Math.max(MAP.inst.getZoom(), ZOOM_IKUT), {animate:true});
  }

  callServer('patroli_ping', {
    sesiId:LIVE.sesiId, deviceId:deviceId(),
    lat:la, lng:ln,
    akurasi:pos.coords.accuracy || 0,
    kecepatan:(pos.coords.speed || 0) * 3.6
  }).then(function(){
    LIVE.kirimGagal = 0;
    var inf = $('liveInfo');
    if(inf) inf.textContent = 'Terkirim '+nowStamp()+' • ketelitian ±'+Math.round(pos.coords.accuracy||0)+
      ' m • perangkat '+deviceId();
  }).catch(function(err){
    LIVE.kirimGagal++;
    if(/sudah ditutup|tidak ditemukan/i.test(err.message)){
      bersihkanSesiLokal();
      toast('Sesi patroli telah ditutup dari sisi lain.','info');
      render();
      return;
    }
    if(LIVE.kirimGagal >= 4){
      var inf2 = $('liveInfo');
      if(inf2) inf2.textContent = 'Gagal mengirim posisi ('+LIVE.kirimGagal+'×) — memeriksa ulang koneksi…';
    }
  });
}

function hentikanBerbagiLokasi(){
  var sid = LIVE.sesiId;
  bersihkanSesiLokal();
  render();
  if(!sid) return;
  callServer('patroli_sesi_stop', {id:sid, deviceId:deviceId()}).then(function(){
    toast('Berbagi lokasi dihentikan.','ok');
    return refresh();
  }).catch(function(err){ toast(err.message,'err'); });
}

function simpanSesiLokal(id){

}
function bersihkanSesiLokal(){
  if(LIVE.watch !== null && LIVE.watch !== undefined){
    try{ navigator.geolocation.clearWatch(LIVE.watch); }catch(e){}
  }
  LIVE.watch = null; LIVE.sesiId = null; LIVE.lastPos = null; LIVE.lastKirim = 0;
  try{ localStorage.removeItem('warganet_sesi'); }catch(e){}
}

/** Sambung kembali sesi yang masih aktif setelah aplikasi dibuka ulang. */
function pulihkanSesiLokal(){
  var sid = '';
  try{ sid = localStorage.getItem('warganet_sesi') || ''; }catch(e){}

/**
 * Ubah nomor Indonesia menjadi format internasional tanpa tanda baca,
 * seperti yang diminta wa.me. Contoh: 0812-3456-7890 → 6281234567890.
 */
function nomorWa(no){
  var d = String(no||'').replace(/[^\d+]/g, '').replace(/^\+/, '');
  if(!d) return '';
  if(d.indexOf('62') === 0)  return d;
  if(d.indexOf('0')  === 0)  return '62' + d.slice(1);
  if(d.indexOf('8')  === 0)  return '62' + d;   // ditulis tanpa nol di depan
  return d;
}

/** Nomor siap dipakai pada tautan tel:. Spasi dan tanda hubung dibuang. */
function nomorTel(no){
  return String(no||'').replace(/[^\d+*#]/g, '');
}

/** Cari Ketua RT dari struktur pengurus — "Wakil Ketua" sengaja dikecualikan. */
function ketuaRT(){
  var list = S.pengurus || [];
  var k = list.filter(function(p){
    return /ketua/i.test(p.jabatan||'') && !/wakil/i.test(p.jabatan||'');
  })[0];
  return k || list.filter(function(p){ return /ketua/i.test(p.jabatan||''); })[0] || list[0] || null;
}

/** Tombol panggilan ke nomor layanan darurat. */
function tombolTelepon(ikon, nama, nomor){
  return '<a class="btn" href="tel:'+esc(nomorTel(nomor))+'" '+
    'title="Panggil '+esc(nama)+' di nomor '+esc(nomor)+'" '+
    'style="justify-content:center;text-decoration:none;color:inherit">'+
    ikon+' '+esc(nama)+' '+esc(nomor)+'</a>';
}

/**
 * Tombol menuju WhatsApp Ketua RT, nomornya diambil langsung dari
 * struktur pengurus. Bila belum diisi, tombol dinonaktifkan dengan
 * keterangan yang jelas alih-alih membuka tautan rusak.
 */
function tombolKetuaRT(){
  var k = ketuaRT();
  var wa = k ? nomorWa(k.noHp) : '';
  if(!wa){
    return '<button class="btn" disabled title="Nomor HP Ketua RT belum diisi pada Struktur Pengurus" '+
      'style="justify-content:center">🏠 Ketua RT —</button>';
  }
  return '<button class="btn green" onclick="waKetuaRT()" '+
    'title="Chat WhatsApp '+esc(k.nama)+' ('+esc(k.noHp)+')" '+
    'style="justify-content:center">💬 WA Ketua RT</button>';
}

/** Buka percakapan WhatsApp dengan Ketua RT, lengkap dengan pesan awal. */
function waKetuaRT(){
  var k = ketuaRT();
  var wa = k ? nomorWa(k.noHp) : '';
  if(!wa){
    toast('Nomor HP Ketua RT belum diisi di Struktur Pengurus.','err');
    return;
  }
  var pengirim = (S.me && S.me.nama) ? S.me.nama : '';
  var alamat = (S.me && S.me.blok) ? (S.me.blok+' '+(S.me.noRumah||'')).trim() : '';
  var pesan = 'Assalamualaikum Pak/Bu ' + (k.nama||'Ketua RT') + ', saya ' +
              (pengirim || 'warga') + (alamat ? ' dari ' + alamat : '') +
              '. Mohon izin menyampaikan:';
  bukaWa(wa, pesan);
}

/** Buka tautan WhatsApp di tab baru; bila diblokir, sediakan salinan tautannya. */
function bukaWa(nomor, pesan){
  var url = 'https://wa.me/' + nomor + (pesan ? '?text=' + encodeURIComponent(pesan) : '');

  /* Jangan pakai fitur 'noopener' di sini: window.open akan selalu
     mengembalikan null sehingga jendela cadangan muncul walau WhatsApp
     sebenarnya sudah terbuka. Rujukan opener diputus setelahnya. */
  var w = window.open(url, '_blank');
  if(w){
    try{ w.opener = null; }catch(e){}
    return;
  }

  {
    openModal('Hubungi lewat WhatsApp',
      '<div class="sub">Peramban memblokir pembukaan tab baru. Salin tautan berikut, '+
      'lalu tempel di peramban atau buka langsung nomornya di WhatsApp.</div>'+
      '<textarea class="inp" id="waBox" style="min-height:70px;font-size:12px">'+esc(url)+'</textarea>'+
      '<div class="sub">Nomor: <b>+'+esc(nomor)+'</b></div>',
      '<button class="btn" onclick="closeModal()">Tutup</button>'+
      '<button class="btn dark" onclick="salinTeks(document.getElementById(\'waBox\').value)">Salin Tautan</button>');
  }
}

var TIPE_CCTV = ['YouTube Live','HLS (.m3u8)','MJPEG / Snapshot','Halaman Web (iframe)','RTSP (butuh aplikasi)'];
var HLS_CDN = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
var _hlsP = null, _snapTimer = null;

/** Hanya izinkan tautan http/https — cegah javascript: dan skema aneh lainnya. */
function urlAman(u){
  u = String(u||'').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}

function ytId(u){
  u = String(u||'');
  var m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  return m ? m[1] : '';
}

function viewCctv(){
  var semua = S.cctv || [];

  var nyala = list.filter(function(c){ return c.status === 'Aktif'; }).length;

  var h = hSection('📹','CCTV Lingkungan',
    list.length+' kamera terdaftar • '+nyala+' sedang aktif'+
    (isPengurus() ? ' • '+semua.filter(function(c){return !c.publik;}).length+' khusus pengurus' : ''),
    isPengurus() ? '<button class="btn dark" onclick="formCctv()">+ Tambah Kamera</button>' : '');

  if(!S.online){
    h += '<div class="mapnote warn">⚡ Mode offline — siaran langsung tidak dapat diputar. '+
         'Daftar kamera di bawah tetap tampil dari data tersimpan.</div>';
  }

  if(!list.length){
    return h + '<div class="card"><div class="empty">'+
      (isPengurus()
        ? 'Belum ada kamera. Tekan “Tambah Kamera”, lalu tempelkan tautan siaran dari NVR/DVR atau kanal YouTube Live milik RT.'
        : 'Pengurus belum membagikan tautan CCTV.')+
      '</div></div>';
  }

  h += '<div class="grid g2">';
  list.forEach(function(c){
    var mati = c.status !== 'Aktif';
    h += '<div class="camcard">'+
      '<div class="camframe" id="cam_'+esc(c.id)+'">'+
        '<span class="camtag'+(mati?' off':'')+'">'+(mati?'NONAKTIF':'● LIVE')+'</span>'+
        (mati || !S.online
          ? '<div class="camoff">'+(mati?'Kamera sedang dimatikan.':'Perlu koneksi internet untuk memutar siaran.')+'</div>'
          : '<div class="camoff">Memuat siaran…</div>')+
      '</div>'+
      '<div class="cammeta">'+
        '<div class="spread"><b style="font-size:13.5px">'+esc(c.nama)+'</b>'+
          (c.publik?'<span class="badge b-green">Warga</span>':'<span class="badge b-gray">Pengurus</span>')+
        '</div>'+
        '<div class="sub" style="margin-top:4px">📍 '+esc(c.lokasi||'-')+' • '+esc(c.tipe)+pendingMark(c)+'</div>'+
        (c.catatan?'<div class="sub" style="margin-top:6px">'+esc(c.catatan)+'</div>':'')+
        '<div class="row" style="margin-top:10px;flex-wrap:wrap">'+
          '<button class="btn sm" onclick="bagikanCctv(\''+jsq(c.id)+'\')">🔗 Bagikan</button>'+
          (urlAman(c.url)?'<a class="btn sm" href="'+esc(urlAman(c.url))+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">↗ Tab Baru</a>':'')+
          (c.lat&&c.lng?'<button class="btn sm" onclick="cctvKePeta(\''+jsq(c.id)+'\')">🗺️ Di Peta</button>':'')+
          (isPengurus()
            ? '<button class="btn sm blue" onclick="formCctv(\''+jsq(c.id)+'\')">Edit</button>'+
              '<button class="btn sm red" onclick="hapusCctv(\''+jsq(c.id)+'\')">Hapus</button>'
            : '')+
        '</div>'+
      '</div></div>';
  });
  h += '</div>';

  h += '<div class="card" style="margin-top:12px;background:#f8fafc">'+
    '<b style="font-size:12px">ℹ️ Catatan teknis pemasangan</b>'+
    '<div class="sub" style="margin-top:6px;line-height:1.6">'+
      '• <b>YouTube Live</b> paling mudah: buat siaran langsung tak terdaftar dari NVR, tempel tautannya di sini.<br>'+
      '• <b>HLS (.m3u8)</b> untuk NVR/DVR yang sudah dipublikasikan ke internet lewat HTTPS.<br>'+
      '• <b>MJPEG / Snapshot</b> menampilkan gambar diam yang disegarkan berkala — ringan untuk kuota.<br>'+
      '• <b>RTSP</b> tidak dapat diputar langsung oleh peramban; perlu diubah dulu ke HLS, atau dibuka lewat aplikasi CCTV di HP.<br>'+
      '• Kamera bertanda <b>Pengurus</b> hanya muncul setelah masuk mode pengurus.'+
    '</div></div>';
  return h;
}

/** Pasang pemutar setelah kartu-kartu CCTV berada di DOM. */
function pasangCctv(){
  if(_snapTimer){ clearInterval(_snapTimer); _snapTimer = null; }
  if(!S.online) return;

  var list = (S.cctv||[]).filter(function(c){
    return (isPengurus() || c.publik) && c.status === 'Aktif' && urlAman(c.url);
  });
  if(!list.length) return;

  var adaSnapshot = false;

  list.forEach(function(c){
    var box = $('cam_'+c.id);
    if(!box) return;
    var url = urlAman(c.url);
    var tag = '<span class="camtag">● LIVE</span>';

    if(c.tipe === 'YouTube Live'){
      var id = ytId(url);
      if(!id){ box.innerHTML = tag+'<div class="camoff">Tautan YouTube tidak dikenali.</div>'; return; }
      box.innerHTML = tag+'<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+
        '?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" '+
        'allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>';

    }else if(c.tipe === 'MJPEG / Snapshot'){
      adaSnapshot = true;
      box.innerHTML = tag+'<img id="snap_'+esc(c.id)+'" src="'+esc(url)+'" alt="'+esc(c.nama)+'" '+
        'onerror="camPesan(\''+jsq(c.id)+'\',\'Gambar kamera tidak dapat dimuat.\',\'Pastikan alamat snapshot dapat diakses dari luar jaringan RT.\')">';

    }else if(c.tipe === 'HLS (.m3u8)'){
      box.innerHTML = tag+'<video id="vid_'+esc(c.id)+'" controls playsinline muted></video>';
      pasangHls(c.id, url);

    }else if(c.tipe === 'Halaman Web (iframe)'){
      box.innerHTML = tag+'<iframe src="'+esc(url)+'" allowfullscreen loading="lazy" '+
        'referrerpolicy="strict-origin-when-cross-origin"></iframe>';

    }else{
      box.innerHTML = tag+'<div class="camoff">Aliran RTSP tidak dapat diputar di peramban.<br>'+
        'Buka lewat aplikasi CCTV, atau ubah dulu ke HLS.</div>';
    }
  });

  if(adaSnapshot){
    _snapTimer = setInterval(function(){
      if(document.hidden || S.tab !== 'cctv') return;
      (S.cctv||[]).forEach(function(c){
        if(c.tipe !== 'MJPEG / Snapshot') return;
        var im = $('snap_'+c.id);
        var u = urlAman(c.url);
        if(im && u) im.src = u + (u.indexOf('?')>=0?'&':'?') + '_t=' + Date.now();
      });
    }, 5000);
  }
}

/** Tampilkan pesan di dalam bingkai kamera tanpa menghilangkan label statusnya. */
function camPesan(id, teks, sub){
  var box = $('cam_'+id);
  if(!box) return;
  box.innerHTML = '<span class="camtag off">TIDAK TERSEDIA</span>'+
    '<div class="camoff">'+esc(teks)+
    (sub ? '<br><span style="font-size:11px;font-weight:600">'+esc(sub)+'</span>' : '')+'</div>';
}

function ensureHls(){
  if(typeof Hls !== 'undefined') return Promise.resolve(Hls);
  if(_hlsP) return _hlsP;
  _hlsP = new Promise(function(resolve, reject){
    var sc = document.createElement('script');
    sc.src = HLS_CDN; sc.async = true;
    sc.onload  = function(){ (typeof Hls !== 'undefined') ? resolve(Hls) : reject(new Error('hls.js tidak termuat.')); };
    sc.onerror = function(){ _hlsP = null; reject(new Error('Pemutar HLS gagal dimuat.')); };
    document.head.appendChild(sc);
  });
  return _hlsP;
}

function pasangHls(id, url){
  var v = $('vid_'+id);
  if(!v) return;

  /* Safari & iOS memutar HLS secara bawaan */
  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = url;
    v.play().catch(function(){});
    return;
  }
  ensureHls().then(function(H){
    if(!$('vid_'+id)) return;
    if(!H.isSupported()){
      camPesan(id, 'Peramban ini tidak mendukung HLS.',
                   'Coba buka lewat Safari di iPhone, atau gunakan tautan YouTube Live.');
      return;
    }
    var hls = new H({lowLatencyMode:true, backBufferLength:30});
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(H.Events.MANIFEST_PARSED, function(){ v.play().catch(function(){}); });
    hls.on(H.Events.ERROR, function(e, data){
      if(!data || !data.fatal) return;
      try{ hls.destroy(); }catch(err){}
      camPesan(id, 'Siaran tidak dapat dijangkau.',
                   'Periksa apakah alamat HLS masih aktif dan dapat diakses publik lewat HTTPS.');
    });
  }).catch(function(err){
    camPesan(id, err.message, 'Pemutar HLS diunduh dari internet — perlu koneksi saat pertama kali dipakai.');
  });
}

/**
 * Tiga jalur pengiriman PIN, karena tidak ada satu pun yang jalan di semua perangkat:
 *   1. submit form  — papan ketik Android menampilkan tombol "Go"/kirim;
 *   2. tombol Enter — papan ketik fisik di komputer;
 *   3. kirim otomatis saat jumlah digit sudah pas — papan ketik angka iPhone
 *      memang tidak memiliki tombol Enter sama sekali.
 */
function pasangPinInput(){
  var el = $('pinInput'), fm = $('pinForm');
  if(!el) return;
  el.focus();

  if(fm){
    fm.addEventListener('submit', function(ev){
      ev.preventDefault();
      cekPin();
    });
  }

  el.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' || ev.keyCode === 13){
      ev.preventDefault();
      cekPin();
    }
  });

  var panjang = String(S.settings.managerPin || '1234').length;
  if(panjang >= 4 && panjang <= 8){
    el.addEventListener('input', function(){
      var isi = String(el.value || '');
      if(isi.length === panjang){
        clearTimeout(el._pinTimer);
        el._pinTimer = setTimeout(cekPin, 260);
      }
    });
  }
}
var _pinSibuk = false;

function cekPin(){
  var el = $('pinInput');
  if(!el || _pinSibuk) return;
  var pin = el.value;
  if(!String(pin).length) return;

  _pinSibuk = true;
  var tombol = document.querySelector('.mf .btn.dark');
  if(tombol) tombol.disabled = true;

  function selesai(){
    _pinSibuk = false;
    var t = document.querySelector('.mf .btn.dark');
    if(t) t.disabled = false;
    var e2 = $('pinInput');
    if(e2){ e2.value = ''; e2.focus(); }
  }

  if(!S.online){
    if(String(pin) === String(S.settings.managerPin||'1234')){
      _pinSibuk = false;
      S.role='pengurus'; saveRole(); closeModal(); render();
      toast('Mode pengurus aktif (offline).','ok');
    }else{
      selesai();
      toast('PIN salah.','err');
    }
    return;
  }

  callServer('verify_pin', {pin:pin, aktorNama:(S.me?S.me.nama:'Pengguna')}).then(function(r){
    if(r.valid){
      _pinSibuk = false;
      S.role='pengurus'; saveRole(); closeModal(); render();
      toast('Mode pengurus aktif.','ok');
    }else{
      selesai();
      toast('PIN salah.','err');
    }
  }).catch(function(e){
    selesai();
    toast(e.message,'err');
  });
}

function openKartu(){
  if(!S.warga.length){ toast('Data warga belum termuat.','err'); return; }
  var opts = S.warga.map(function(w){ return '<option value="'+esc(w.id)+'"'+
    (S.me && S.me.id===w.id?' selected':'')+'>'+esc(w.nama)+' — '+esc(w.blok)+'</option>'; }).join('');
  openModal('Kartu Digital & Verifikasi 2 Langkah',
    '<div><label class="f">Pilih Identitas Warga (perangkat ini)</label>'+
      '<select class="inp" id="selMe">'+opts+'</select>'+
      '<div class="sub" style="margin-top:4px">Identitas ini dipakai sebagai penanda pelapor, pemilih voting, dan pencatat aktivitas.</div></div>'+
    '<div class="card flat" style="background:#fef9c3"><b style="font-size:12px">🔑 Kartu dilindungi PIN</b>'+
      '<div class="sub" style="margin-top:4px">Membuka kartu digital memerlukan PIN milik warga yang bersangkutan, '+
      'sehingga tidak dapat dibuka warga lain. PIN bawaan untuk warga baru adalah <b>1234</b> dan sebaiknya segera diganti '+
      'lewat tombol Ganti PIN di dalam kartu. Lupa PIN? Mintalah pengurus mengembalikannya ke bawaan.</div></div>'+
    '<div class="card flat" style="background:#f8fafc"><b style="font-size:12px">🔐 Verifikasi 2 Langkah (2FA)</b>'+
      '<div class="sub" style="margin-top:4px">Saat 2FA aktif, pengurus akan meminta konfirmasi tambahan lewat WhatsApp/telepon '+
      'sebelum menyetujui perubahan data sensitif atau pencairan dana kas.</div></div>',
    '<button class="btn" onclick="closeModal()">Tutup</button>'+
    '<button class="btn dark" onclick="setMe()">Simpan &amp; Lihat Kartu</button>');
}
function setMe(){
  var id = $('selMe').value;
  var w = S.warga.filter(function(x){return x.id===id;})[0];
  if(w){ S.me = w; saveMe(); }
  closeModal();
  if(w) kartuWarga(w.id);
}

function openAI(){
  var chat = S.aiChat.map(function(m){
    return '<div class="aimsg '+(m.r==='me'?'me':'ai')+'">'+esc(m.t)+'</div>';
  }).join('');
  openModal('✨ Asisten Smart Warga',
    (!S.aiEnabled
      ? '<div class="card flat b-yellow"><b>Fitur AI belum aktif.</b><div class="sub" style="margin-top:4px">'+
        'Buka Google Sheets → menu <b>WargaNet ▸ Setel Gemini API Key</b>, lalu muat ulang aplikasi.</div></div>'
      : '')+
    '<div class="sub">Tanya seputar tata tertib RT, jadwal sampah, ronda, surat pengantar, atau kontak darurat.</div>'+
    '<div id="aiChat" style="display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto">'+
      (chat || '<div class="empty">Belum ada percakapan.</div>')+'</div>'+
    '<div class="row"><input class="inp" id="aiQ" placeholder="Tulis pertanyaan Anda…" style="flex:1">'+
      '<button class="btn dark" onclick="kirimAI()">Kirim</button></div>'+
    '<div class="row">'+
      ['Jam berapa portal ditutup?','Kapan jadwal angkut sampah?','Cara mengurus surat domisili?','Kontak darurat RT?']
        .map(function(q){ return '<button class="btn sm" onclick="tanyaCepat(\''+jsq(q)+'\')">'+esc(q)+'</button>'; }).join('')+
    '</div>',
    '<button class="btn" onclick="closeModal()">Tutup</button>'+
    '<button class="btn red" onclick="S.aiChat=[];openAI()">Bersihkan</button>', true);
  setTimeout(function(){
    var e=$('aiQ'); if(e){ e.focus(); e.addEventListener('keydown',function(ev){ if(ev.key==='Enter') kirimAI(); }); }
    var c=$('aiChat'); if(c) c.scrollTop=c.scrollHeight;
  },80);
}
function tanyaCepat(q){ var e=$('aiQ'); if(e){ e.value=q; kirimAI(); } }
function kirimAI(){
  var e = $('aiQ'); if(!e) return;
  var q = e.value.trim(); if(!q) return;
  if(!S.online){ toast('Asisten AI memerlukan koneksi internet.','err'); return; }
  S.aiChat.push({r:'me', t:q});
  S.aiChat.push({r:'ai', t:'⏳ Sedang menjawab…'});
  openAI();
  callServer('ai_assistant', {question:q}).then(function(r){
    S.aiChat[S.aiChat.length-1] = {r:'ai', t:r.answer||'(kosong)'};
    openAI();
  }).catch(function(err){
    S.aiChat[S.aiChat.length-1] = {r:'ai', t:'⚠️ '+err.message};
    openAI();
  });
}

function openSettings(){
  var url = apiUrl();
  openModal('⚙️ Pengaturan Aplikasi',
    '<div class="card flat" style="background:#f8fafc"><b style="font-size:12px">Status Sistem</b>'+
      '<div class="sub" style="margin-top:4px">'+
        'Mode: <b>'+(isGas()?'Google Apps Script':'PWA statis')+'</b><br>'+
        'Koneksi: <b>'+(S.online?'Online':'Offline')+'</b><br>'+
        'Antrian offline: <b>'+S.outbox.length+' perubahan</b><br>'+
        'Asisten AI: <b>'+(S.aiEnabled?'Aktif':'Nonaktif')+'</b>'+
      '</div></div>'+
    (isGas() ? '' :
      '<div><label class="f">URL Web App Apps Script (/exec)</label>'+
      '<input class="inp" id="setUrl" value="'+esc(url)+'" placeholder="https://script.google.com/macros/s/…/exec">'+
      '<div class="sub" style="margin-top:4px">Wajib diisi saat aplikasi dibuka dari GitHub Pages.</div></div>')+
    (isPengurus() ?
      '<div><label class="f">Judul Aplikasi</label><input class="inp" id="setTitle" value="'+esc(S.settings.appTitle)+'"></div>'+
      '<div><label class="f">Sub Judul / Nama Kompleks</label><input class="inp" id="setSub" value="'+esc(S.settings.appSubtitle)+'"></div>'+
      '<div><label class="f">Nama RT/RW</label><input class="inp" id="setRT" value="'+esc(S.settings.namaRT||'')+'"></div>'+
      '<div><label class="f">Nominal Iuran Standar (Rp)</label><input class="inp" id="setNom" type="number" value="'+esc(S.settings.iuranNominal)+'"></div>'+
      '<div><label class="f">PIN Pengurus (4–8 digit)</label><input class="inp" id="setPin" value="'+esc(S.settings.managerPin)+'"></div>'+
      '<div class="card flat" style="background:#f8fafc"><b style="font-size:12px">🗺️ Tampilan Awal Peta</b>'+
        '<div class="grid g3" style="margin-top:8px">'+
          '<div><label class="f">Lintang</label><input class="inp" id="setLat" value="'+esc(S.settings.petaLat||'')+'" placeholder="-6.903400"></div>'+
          '<div><label class="f">Bujur</label><input class="inp" id="setLng" value="'+esc(S.settings.petaLng||'')+'" placeholder="107.618100"></div>'+
          '<div><label class="f">Perbesaran</label><input class="inp" id="setZoom" type="number" min="10" max="21" value="'+esc(S.settings.petaZoom||'18')+'"></div>'+
        '</div>'+
        '<div class="sub" style="margin-top:6px">Titik ini menjadi pusat peta saat aplikasi dibuka. Cara termudah: buka tab Patroli &amp; Peta, geser peta ke lingkungan RT, lalu tekan <b>📌 Simpan Tampilan</b>.</div>'+
      '</div>'
      : '<div class="card flat b-gray"><div class="sub">Pengaturan aplikasi hanya dapat diubah oleh pengurus.</div></div>')+
    '<div class="row"><button class="btn" onclick="paksaMuatUlang()">🔄 Muat Ulang Data</button>'+
      '<button class="btn" onclick="flushOutbox()">📤 Kirim Antrian Offline</button>'+
      '<button class="btn red" onclick="hapusCache()">🗑️ Hapus Cache Lokal</button></div>',
    '<button class="btn" onclick="closeModal()">Tutup</button>'+
    '<button class="btn dark" onclick="simpanSettings()">Simpan</button>', true);
}
function simpanSettings(){
  if($('setUrl')) setApiUrl($('setUrl').value);
  if(isPengurus() && $('setTitle')){
    var v = {
      appTitle: $('setTitle').value, appSubtitle: $('setSub').value,
      namaRT: $('setRT').value, iuranNominal: $('setNom').value, managerPin: $('setPin').value
    };
    if($('setLat'))  v.petaLat  = $('setLat').value;
    if($('setLng'))  v.petaLng  = $('setLng').value;
    if($('setZoom')) v.petaZoom = $('setZoom').value;
    closeModal();
    mutate('settings_update', v, {okMsg:'Pengaturan tersimpan.'}).then(render).catch(function(){});
    return;
  }
  closeModal();
  toast('Pengaturan tersimpan.','ok');
  refresh().catch(function(){});
}
function paksaMuatUlang(){
  closeModal();
  toast('Memuat ulang data…','info');
  refresh().then(function(){ toast('Data terbaru dimuat.','ok'); }).catch(function(e){ toast(e.message,'err'); });
}
function hapusCache(){
  konfirmasi('Hapus seluruh cache lokal? Antrian perubahan offline yang belum terkirim akan ikut hilang.', function(){
    try{ localStorage.removeItem(LS_CACHE); localStorage.removeItem(LS_OUT); }catch(e){}
    S.outbox = [];
    location.reload();
  });
}

/* ============================================================
 * INISIALISASI
 * ============================================================ */
function boot(){
  $('btnRole').onclick = toggleRole;
  $('btnAI').onclick   = openAI;
  $('btnQR').onclick   = openKartu;
  $('btnSet').onclick  = openSettings;

  loadCache();
  S.ready = true;
  render();
  updateNetBar();

  if(!isGas() && !apiUrl()){
    setTimeout(function(){
      toast('URL Web App belum diisi — buka ⚙️ Pengaturan.','info');
      openSettings();
    }, 600);
    return;
  }

  refresh().then(function(){
    pulihkanSesiLokal();
    return flushOutbox();
  }).catch(function(err){
    toast(S.warga.length ? 'Offline — menampilkan data tersimpan.' : err.message, S.warga.length?'info':'err');
  });

  /* sinkronisasi berkala tiap 3 menit saat online */
  setInterval(function(){
    if(S.online && !document.hidden){ flushOutbox().catch(function(){}); }
  }, 180000);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();


/* ---------- Service Worker (mode PWA statis) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){
      console.warn('Service worker gagal didaftarkan:', e);
    });
  });
}

</script>
