<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>WargaNet RT/RW</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#0f172a;
  --acc:#fde047; --blue:#3b82f6; --red:#ef4444; --green:#22c55e; --orange:#f97316;
  --violet:#8b5cf6; --shadow:4px 4px 0px 0px #000;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.45}
body{padding-bottom:88px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--blue)}
.hide{display:none !important}

/* ---------- primitives ---------- */
.card{background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);padding:14px}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);
  background:#fff;padding:8px 12px;font-weight:800;font-size:12px;text-transform:uppercase;
  letter-spacing:.4px;box-shadow:2px 2px 0 #000;transition:.08s}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:hover{background:var(--acc)}
.btn.dark{background:#111;color:#fff}.btn.dark:hover{background:#000}
.btn.blue{background:var(--blue);color:#fff}.btn.blue:hover{background:#2563eb}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:#dc2626}
.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:#16a34a}
.btn.sm{padding:5px 8px;font-size:10.5px;box-shadow:1px 1px 0 #000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;border:2px solid var(--line);padding:2px 7px;font-size:10px;
  font-weight:900;text-transform:uppercase;letter-spacing:.5px;background:#fff}
.b-green{background:#bbf7d0}.b-red{background:#fecaca}.b-yellow{background:#fef08a}
.b-blue{background:#bfdbfe}.b-gray{background:#e2e8f0}.b-violet{background:#ddd6fe}
.b-orange{background:#fed7aa}
h2.sec{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;
  display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g4,.g2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
label.f{display:block;font-size:10.5px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:3px;color:#334155}
.inp{width:100%;border:2px solid var(--line);padding:8px 10px;background:#fff;outline:none}
.inp:focus{box-shadow:2px 2px 0 var(--blue)}
textarea.inp{min-height:80px;resize:vertical}
.table-wrap{overflow-x:auto;border:2px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:12.5px}
th{background:#111;color:#fff;text-align:left;padding:8px 10px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid #e2e8f0;vertical-align:top}
tr:hover td{background:#fffbea}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:12.5px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:#111;color:#fff;border-bottom:3px solid #000}
.hd{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;background:var(--acc);border:2px solid #fff;display:flex;
  align-items:center;justify-content:center;font-weight:900;color:#111;font-size:16px;flex:none}
.htitle{font-weight:900;font-size:15px;letter-spacing:.4px;line-height:1.1}
.hsub{font-size:10.5px;color:#cbd5e1;text-transform:uppercase;letter-spacing:1px}
.hbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
.ico{width:34px;height:34px;border:2px solid #fff;display:flex;align-items:center;
  justify-content:center;background:#1e293b;font-size:15px}
.ico:hover{background:var(--acc);color:#111}
.role-pill{border:2px solid #fff;padding:5px 9px;font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:.6px;background:var(--blue)}
.role-pill.warga{background:#334155}

/* net status */
#netbar{display:none;background:var(--orange);color:#111;border-bottom:2px solid #000;
  font-size:11.5px;font-weight:800;padding:5px 14px;text-align:center;letter-spacing:.3px}
#netbar.on{display:block}
#netbar.sync{background:var(--blue);color:#fff}

/* ---------- tabs ---------- */
.tabwrap{max-width:1200px;margin:14px auto 0;padding:0 14px}
.tabs{background:#fff;border:2px solid #000;box-shadow:var(--shadow);padding:8px;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;border:2px solid #000;padding:7px 11px;
  font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-right:6px;
  background:#f8fafc;box-shadow:2px 2px 0 #000}
.tab:hover{background:var(--acc)}
.tab.active{background:#111;color:#fff;box-shadow:2px 2px 0 var(--blue)}
main{max-width:1200px;margin:0 auto;padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- stat ---------- */
.stat{background:#fff;border:2px solid #000;box-shadow:var(--shadow);padding:12px}
.stat .lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:#475569}
.stat .val{font-size:22px;font-weight:900;margin-top:4px;letter-spacing:-.5px}
.stat .hint{font-size:11px;color:var(--muted);margin-top:2px}
.stat.acc{background:var(--acc)}
.stat.dark{background:#111;color:#fff}
.stat.dark .lbl{color:#cbd5e1}.stat.dark .hint{color:#94a3b8}

/* ---------- bars / charts ---------- */
.bar{height:14px;background:#e2e8f0;border:2px solid #000;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.g>i{background:var(--green)}.bar.r>i{background:var(--red)}
.bar.y>i{background:var(--acc)}
.spark{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:2px solid #000;
  padding-top:6px}
.spark>div{flex:1;background:var(--blue);border:2px solid #000;border-bottom:none;min-height:3px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:80;display:flex;
  align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#fff;border:3px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,1);
  width:100%;max-width:600px;margin:24px auto}
.modal.wide{max-width:860px}
.modal .mh{background:#111;color:#fff;padding:12px 14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.modal .mh b{font-size:14px;text-transform:uppercase;letter-spacing:.6px}
.modal .mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 16px;border-top:2px solid #000;display:flex;gap:8px;justify-content:flex-end;
  background:#f8fafc;flex-wrap:wrap}
.x{font-size:20px;line-height:1;color:#fff;padding:0 4px}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:120;
  display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{border:2px solid #000;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;
  font-weight:700;background:#fff}
.toast.ok{background:#bbf7d0}.toast.err{background:#fecaca}.toast.info{background:#bfdbfe}

/* ---------- SOS ---------- */
.sosbtn{width:100%;background:var(--red);color:#fff;border:3px solid #000;
  box-shadow:6px 6px 0 #000;padding:18px;font-size:18px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase}
.sosbtn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.pulse{animation:pl 1.1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.55}}
.map{position:relative;background:#dcfce7;border:2px solid #000;height:260px;
  background-image:linear-gradient(#00000010 1px,transparent 1px),
                   linear-gradient(90deg,#00000010 1px,transparent 1px);
  background-size:28px 28px}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border:2px solid #000;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;
  font-weight:900;background:#fff;box-shadow:2px 2px 0 #000}

/* ---------- misc ---------- */
.pointpill{background:var(--acc);border:2px solid #000;padding:2px 7px;font-weight:900;font-size:11px}
.avatar{width:44px;height:44px;border:2px solid #000;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none}
.thread{border:2px solid #000;background:#fff;padding:12px;box-shadow:2px 2px 0 #000}
.reply{border-left:4px solid #000;background:#f8fafc;padding:8px 10px;margin-top:8px}
.chip{border:2px solid #000;padding:4px 8px;font-size:10.5px;font-weight:900;background:#fff;
  text-transform:uppercase;letter-spacing:.4px}
.chip.on{background:#111;color:#fff}
.log{border-left:4px solid var(--blue);background:#fff;border:2px solid #000;padding:9px 11px}
.aimsg{border:2px solid #000;padding:10px;background:#f8fafc;white-space:pre-wrap;font-size:13px}
.aimsg.me{background:#bfdbfe;margin-left:28px}
.aimsg.ai{background:#fef9c3;margin-right:28px}
.qrbox{width:180px;height:180px;border:2px solid #000;display:flex;align-items:center;
  justify-content:center;background:#fff;margin:0 auto;text-align:center;padding:8px;
  font-size:11px;word-break:break-all;font-weight:800}

/* ============================================================
   PETA LEAFLET — pos patroli, bidang persil, pelacakan langsung
   ============================================================ */
.wnmap{height:440px;border:2px solid #000;background:#dbeafe;position:relative;z-index:0}
.wnmap.tall{height:520px}
@media(max-width:700px){.wnmap{height:340px}.wnmap.tall{height:380px}}
.wnmap.drawing{cursor:crosshair}
/* Saat menggambar, semua objek peta dibuat tembus-klik agar tiap ketukan
   selalu sampai ke peta — termasuk ketukan tepat di atas bidang yang sudah ada. */
.wnmap.drawing .leaflet-overlay-pane,
.wnmap.drawing .leaflet-marker-pane,
.wnmap.drawing .leaflet-tooltip-pane,
.wnmap.drawing .leaflet-popup-pane{pointer-events:none}
.maptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.mapnote{border:2px solid #000;background:#fef9c3;padding:7px 10px;font-size:11.5px;
  font-weight:700;margin-bottom:8px}
.mapnote.warn{background:#fee2e2}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;font-weight:800}
.legend i{display:inline-block;width:13px;height:13px;border:2px solid #000;
  margin-right:4px;vertical-align:-2px}
.mapfallback{position:relative;background:#dcfce7;border:2px solid #000;height:300px;
  background-image:linear-gradient(#00000010 1px,transparent 1px),
    linear-gradient(90deg,#00000010 1px,transparent 1px);background-size:34px 34px}

/* label nomor rumah pada bidang */
.lbl-bidang{background:#fff;border:2px solid #000;font-size:10px;font-weight:900;
  padding:1px 4px;white-space:nowrap;box-shadow:1px 1px 0 #000;text-align:center}
.lbl-bidang.fasum{background:#fed7aa}
.leaflet-tooltip.lbl-bidang:before{display:none}

/* penanda pos jaga & petugas */
.mk{width:30px;height:30px;border:2px solid #000;box-shadow:2px 2px 0 #000;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.mk.round{border-radius:50%}
.mk-live{width:34px;height:34px;border:3px solid #000;border-radius:50%;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:0 0 0 4px rgba(0,0,0,.12);animation:blip 1.6s ease-out infinite}
@keyframes blip{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}
  70%{box-shadow:0 0 0 16px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.leaflet-popup-content-wrapper{border-radius:0;border:2px solid #000;box-shadow:4px 4px 0 #000}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.5}
.leaflet-popup-tip{border:2px solid #000}
.leaflet-container{font-family:inherit}
.leaflet-bar a{border-radius:0 !important;border-bottom:2px solid #000 !important;
  color:#000 !important;font-weight:900}
.leaflet-control-attribution{font-size:9px}

/* pil status berbagi lokasi */
.livepill{display:inline-flex;align-items:center;gap:6px;border:2px solid #000;
  background:#111;color:#fff;padding:5px 9px;font-size:11px;font-weight:900;
  text-transform:uppercase;letter-spacing:.5px}
.livepill .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;
  animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{opacity:.25}}
.livepill.off{background:#fff;color:#111}.livepill.off .dot{background:#94a3b8;animation:none}

/* ============================================================
   FOTO PROFIL — avatar, pemilih berkas, dan tampilan zoom
   ============================================================ */
.ava{width:44px;height:44px;border:2px solid #000;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;
  flex-shrink:0;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.lg{width:64px;height:64px;font-size:20px}
.ava.xl{width:92px;height:92px;font-size:28px}
.ava.klik{cursor:zoom-in}
.ava.klik:hover{box-shadow:0 0 0 3px var(--acc)}
.fotopick{display:flex;gap:10px;align-items:center;border:2px solid #000;padding:8px;
  background:#f8fafc}
.fotopick .ava{width:56px;height:56px}
.fotohint{font-size:10.5px;color:var(--muted);margin-top:3px}
.fotobtns{display:flex;gap:6px;flex-wrap:wrap}
.fotobtn{display:inline-flex;align-items:center;gap:5px;border:2px solid #000;background:#fff;
  padding:6px 10px;font-size:11.5px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #000;
  font-family:inherit;line-height:1.2}
.fotobtn:active{transform:translate(2px,2px);box-shadow:none}
.fotobtn.cam{background:var(--acc)}
.fotobtn input{display:none}
.fotoprev{max-width:100%;border:2px solid #000;display:block;margin-top:8px;cursor:zoom-in}
.fotoprev.kecil{max-height:150px;width:auto}

/* lightbox zoom */
.lbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;
  flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.lbox .stage{flex:1;width:100%;overflow:hidden;display:flex;align-items:center;
  justify-content:center;cursor:grab}
.lbox .stage.grab{cursor:grabbing}
.lbox img{max-width:none;transform-origin:center center;user-select:none;
  -webkit-user-drag:none;transition:transform .05s linear}
.lbox .lbar{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;
  padding:10px;background:#111;flex-wrap:wrap}
.lbox .lcap{color:#fff;font-size:12px;font-weight:800;margin-right:auto;padding-left:8px}
.lbox .btn{background:#fff}

/* ============================================================
   CCTV
   ============================================================ */
.camcard{border:2px solid #000;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.camframe{position:relative;width:100%;aspect-ratio:16/9;background:#0f172a;
  border-bottom:2px solid #000;display:flex;align-items:center;justify-content:center}
.camframe iframe,.camframe video,.camframe img{width:100%;height:100%;border:0;
  object-fit:cover;display:block;background:#000}
.camoff{color:#94a3b8;font-size:12px;font-weight:800;text-align:center;padding:16px;
  line-height:1.6}
.camtag{position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;font-size:9.5px;
  font-weight:900;letter-spacing:.6px;padding:3px 7px;border:2px solid #000;z-index:2}
.camtag.off{background:#64748b}
.cammeta{padding:11px}

/* ---------- print (Laporan PDF) ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0}
  header,.tabwrap,#netbar,#toasts,.noprint,main{display:none !important}
  #printArea{display:block !important;padding:0}
  .wnmap,.camframe,.lbox,.leaflet-control-container{display:none !important}
  .card{box-shadow:none;border:1px solid #000}
  table{min-width:0;font-size:11px}
  th{background:#eee !important;color:#000 !important;-webkit-print-color-adjust:exact}
  @page{size:A4;margin:14mm}
}
</style>

<link rel="icon" href="icon.svg" type="image/svg+xml">

<body>

<header>
  <div class="hd">
    <div class="logo">W</div>
    <div>
      <div class="htitle" id="hTitle">WargaNet RT 05</div>
      <div class="hsub" id="hSub">Villa Harmony</div>
    </div>
    <div class="hbtns">
      <button class="ico" id="btnAI" title="Asisten AI">✨</button>
      <button class="ico" id="btnQR" title="Kartu Digital &amp; 2FA">🪪</button>
      <button class="ico" id="btnSet" title="Pengaturan">⚙️</button>
      <button class="role-pill warga" id="btnRole">Mode: Warga</button>
    </div>
  </div>
</header>

<div id="netbar"></div>

<div class="tabwrap"><div class="tabs" id="tabs"></div></div>

<main id="view"><div class="empty">Memuat data…</div></main>

<div id="printArea"></div>
<div id="modals"></div>
<div id="toasts"></div>

/* ============================================================
 * KODE QR BERUBAH
 *
 * Token statis punya satu kelemahan mendasar: sekali difoto, ia berlaku
 * selamanya. Maka kartu tidak lagi memuat token itu apa adanya, melainkan
 * kode yang dihitung ulang tiap 30 detik dari rahasia milik warga:
 *
 *     WN1|<wargaId>|<slot>|<kode>
 *
 * Rahasianya hanya diberikan kepada pemilik kartu setelah PIN-nya
 * terverifikasi, dan tidak pernah ikut dalam data yang dibagikan.
 * ============================================================ */
var QR_DETIK_SLOT = 30;

function slotQrSekarang(){
  return Math.floor(Date.now() / 1000 / QR_DETIK_SLOT);
}

/** Kode enam karakter untuk satu slot waktu. */
function kodeQrSlot(rahasia, slot){
  return sha256Hex(String(rahasia) + '|' + slot).slice(0, 6).toUpperCase();
}

/** Isi kode QR kartu. Kembali ke token lama bila rahasia belum tersedia. */
function muatanQrKartu(w){
  if(!w) return '';
  if(w.qrRahasia){
    var slot = slotQrSekarang();
    return 'WN1|' + w.id + '|' + slot + '|' + kodeQrSlot(w.qrRahasia, slot);
  }
  return w.qrCodeToken || w.id || '';
}

/* ============================================================
 * WargaNet RT/RW — Frontend (vanilla JS, dua mode)
 *   Mode GAS : google.script.run
 *   Mode PWA : fetch() ke URL /exec (Content-Type text/plain → tanpa preflight CORS)
 * ============================================================ */

/* ---------- konfigurasi endpoint ---------- */
var LS_API   = 'warganet_api_url';
var LS_CACHE = 'warganet_cache';
var LS_OUT   = 'warganet_outbox';
var LS_ROLE  = 'warganet_role';
var LS_USER  = 'warganet_user';

function isGas(){
  return typeof google !== 'undefined' && google.script && google.script.run;
}
function apiUrl(){
  try{
    return localStorage.getItem(LS_API) || (window.GAS_API_URL || '');
  }catch(e){ return window.GAS_API_URL || ''; }
}
function setApiUrl(u){ try{ localStorage.setItem(LS_API,(u||'').trim()); }catch(e){} }

/* ---------- pemanggilan server ---------- */
function callServer(action, payload){
  return new Promise(function(resolve,reject){
    var req = { action: action, payload: payload || {} };
    if(isGas()){
      google.script.run
        .withSuccessHandler(function(txt){
          var env; try{ env = JSON.parse(txt); }catch(e){ return reject(new Error('Balasan server rusak.')); }
          env.ok ? resolve(env.data) : reject(new Error(env.error||'Gagal.'));
        })
        .withFailureHandler(function(err){ reject(new Error(err && err.message ? err.message : 'Gagal menghubungi server.')); })
        .runServer(JSON.stringify(req));
      return;
    }
    var url = apiUrl();
    if(!url) return reject(new Error('URL API belum diisi. Buka ⚙️ Pengaturan → URL Web App.'));
    fetch(url, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(req)
    }).then(function(r){ return r.text(); })
      .then(function(t){
        var env; try{ env = JSON.parse(t); }catch(e){ return reject(new Error('Balasan server bukan JSON.')); }
        env.ok ? resolve(env.data) : reject(new Error(env.error||'Gagal.'));
      })
      .catch(function(e){ reject(new Error('Tidak dapat menghubungi server: '+e.message)); });
  });
}

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

var LS_KARTU = 'warganet_kartu';

function kartuTersimpan(){
  try{ return JSON.parse(localStorage.getItem(LS_KARTU) || '{}'); }
  catch(e){ return {}; }
}

function simpanKartu(data){
  if(!data || !data.id) return;
  try{
    var semua = kartuTersimpan();
    semua[data.id] = data;
    localStorage.setItem(LS_KARTU, JSON.stringify(semua));
  }catch(e){}
}

function ambilKartu(id){
  var k = kartuTersimpan();
  return k[id] || null;
}

function lupakanKartu(id){
  try{
    var semua = kartuTersimpan();
    delete semua[id];
    localStorage.setItem(LS_KARTU, JSON.stringify(semua));
  }catch(e){}
}

/**
 * Ubah nilai kolom fotoUrl menjadi alamat gambar yang bisa dipasang di <img>.
 * Nilai boleh berupa ID berkas Drive, tautan Drive lengkap, atau URL gambar biasa.
 */
function fotoSrc(v, lebar){
  v = String(v||'').trim();
  if(!v) return '';
  lebar = lebar || 400;
  if(v.indexOf('data:') === 0) return v;
  var m = v.match(/[-\w]{25,}/);
  if(/drive\.google\.com|googleusercontent\.com/.test(v) && m) v = m[0];
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[-\w]{25,}$/.test(v)) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(v)+'&sz=w'+lebar;
  return '';
}

/** Blok avatar: pakai foto bila ada, jika tidak pakai inisial nama. */
function avatarHtml(nama, foto, kelas, bisaZoom){
  var src = fotoSrc(foto, 400);
  var cls = 'ava'+(kelas?' '+kelas:'')+((src&&bisaZoom!==false)?' klik':'');
  var atr = (src && bisaZoom!==false)
    ? ' onclick="zoomFoto(\'' + jsq(foto) + '\',\'' + jsq(nama||'') + '\')" title="Ketuk untuk perbesar"'
    : '';
  if(src){
    return '<div class="'+cls+'"'+atr+'><img src="'+esc(src)+'" alt="'+esc(nama||'Foto')+'" loading="lazy" '+
           'onerror="this.parentNode.innerHTML=\'' + jsq(initials(nama)) + '\'"></div>';
  }
  return '<div class="'+cls+'">'+esc(initials(nama))+'</div>';
}

/**
 * Perkecil gambar di sisi peramban sebelum diunggah.
 * Sisi terpanjang dibatasi maxPx, hasil dikompres ke JPEG.
 */
function kecilkanGambar(file, maxPx, mutu){
  maxPx = maxPx || 640; mutu = mutu || 0.78;
  return new Promise(function(resolve, reject){
    if(!file) return reject(new Error('Berkas tidak dipilih.'));
    if(!/^image\//.test(file.type)) return reject(new Error('Berkas harus berupa gambar (JPG/PNG).'));
    var fr = new FileReader();
    fr.onerror = function(){ reject(new Error('Gagal membaca berkas.')); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('Gambar tidak dapat dibuka.')); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var sk = Math.min(1, maxPx/Math.max(w,h));
        var cw = Math.max(1, Math.round(w*sk)), ch = Math.max(1, Math.round(h*sk));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#ffffff'; cx.fillRect(0,0,cw,ch);
        cx.drawImage(img, 0, 0, cw, ch);
        try{ resolve(cv.toDataURL('image/jpeg', mutu)); }
        catch(e){ reject(new Error('Gagal mengompres gambar.')); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================================================
 * GEOMETRI — luas poligon & titik tengah
 * ============================================================ */

/** Luas (m²) dari cincin [[lat,lng],...]. */
function luasRing(ring){
  if(!ring || ring.length < 3) return 0;
  var latRef = 0, i;
  for(i=0;i<ring.length;i++) latRef += Number(ring[i][0]);
  latRef /= ring.length;
  var rad = Math.PI/180;
  var mLat = 111132.92 - 559.82*Math.cos(2*latRef*rad) + 1.175*Math.cos(4*latRef*rad);
  var mLng = 111412.84*Math.cos(latRef*rad) - 93.5*Math.cos(3*latRef*rad);
  var sum = 0;
  for(i=0;i<ring.length;i++){
    var a = ring[i], b = ring[(i+1)%ring.length];
    sum += (Number(a[1])*mLng)*(Number(b[0])*mLat) - (Number(b[1])*mLng)*(Number(a[0])*mLat);
  }
  return Math.abs(sum/2);
}

/** Titik tengah sederhana (rata-rata simpul) untuk menaruh label. */
function pusatRing(ring){
  var la=0, ln=0;
  for(var i=0;i<ring.length;i++){ la += Number(ring[i][0]); ln += Number(ring[i][1]); }
  return [la/ring.length, ln/ring.length];
}

/** Jarak dua titik dalam meter (haversine). */
function jarakMeter(a, b){
  var R = 6371000, rad = Math.PI/180;
  var dLa = (b[0]-a[0])*rad, dLn = (b[1]-a[1])*rad;
  var x = Math.sin(dLa/2)*Math.sin(dLa/2) +
          Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLn/2)*Math.sin(dLn/2);
  return 2*R*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function parseRing(v){
  try{
    var a = (typeof v === 'string') ? JSON.parse(v) : v;
    return (a && a.length >= 3) ? a : null;
  }catch(e){ return null; }
}

function luasTeks(m2){
  m2 = Number(m2)||0;
  if(m2 >= 10000) return (m2/10000).toFixed(2).replace('.',',')+' ha';
  return Math.round(m2).toLocaleString('id-ID')+' m²';
}

/* ============================================================
 * LEAFLET — dimuat sesuai kebutuhan dari CDN
 * ============================================================ */
/* Pustaka disertakan dalam paket (folder lib/) supaya aplikasi tidak
   bergantung pada CDN pihak ketiga saat dijual. Alamat CDN tetap disimpan
   sebagai cadangan bila berkas lokal tidak ditemukan — misalnya saat
   dijalankan langsung dari Apps Script tanpa GitHub Pages. */
var LEAFLET_CSS = 'lib/leaflet.css';
var LEAFLET_JS  = 'lib/leaflet.js';
var LEAFLET_CSS_CDN = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
var LEAFLET_JS_CDN  = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
var _leafletP = null;

/**
 * Sediakan Leaflet.
 *
 * Pada bundel Apps Script, Leaflet sudah tertanam di dalam halaman sehingga
 * fungsi ini langsung selesai tanpa permintaan jaringan apa pun. Pada bundel
 * GitHub Pages, berkas lokal lib/ dicoba lebih dulu; CDN hanya dipakai bila
 * berkas lokal benar-benar tidak ada.
 */
function ensureLeaflet(){
  if(typeof L !== 'undefined') return Promise.resolve(L);
  if(_leafletP) return _leafletP;
  _leafletP = new Promise(function(resolve, reject){
    if(!document.getElementById('leafletCss')){
      var lk = document.createElement('link');
      lk.id='leafletCss'; lk.rel='stylesheet'; lk.href=LEAFLET_CSS;
      lk.onerror = function(){ lk.href = LEAFLET_CSS_CDN; };
      document.head.appendChild(lk);
    }
    function muat(src, cadangan){
      var sc = document.createElement('script');
      sc.src = src; sc.async = true;
      sc.onload  = function(){
        (typeof L !== 'undefined') ? resolve(L) : reject(new Error('Leaflet tidak termuat.'));
      };
      sc.onerror = function(){
        if(cadangan){ muat(cadangan, null); return; }
        _leafletP = null;
        reject(new Error('Peta gagal dimuat — berkas lib/leaflet.js tidak ditemukan dan CDN tidak dapat dijangkau.'));
      };
      document.head.appendChild(sc);
    }
    muat(LEAFLET_JS, LEAFLET_JS_CDN);
  });
  return _leafletP;
}

/* ------------------------------------------------------------------
 * SUMBER PETA KUSTOM
 *
 * Tiga bentuk yang lazim dipakai instansi dan perusahaan di Indonesia:
 *
 *   XYZ    — pola ubin biasa .../{z}/{x}/{y}.png
 *   ArcGIS — layanan ArcGIS REST. Perhatikan urutan sumbunya TERBALIK:
 *            .../MapServer/tile/{z}/{y}/{x} (baris dulu, baru kolom).
 *            Banyak instansi hanya memberi alamat sampai /MapServer,
 *            jadi sisanya dilengkapi sendiri oleh aplikasi.
 *   WMS    — layanan OGC. Butuh nama lapisan, bukan pola ubin.
 * ------------------------------------------------------------------ */
var JENIS_PETA_KUSTOM = {
  xyz:    {nama:'XYZ / TMS (pola ubin biasa)',
           contoh:'https://server-anda.id/tiles/{z}/{x}/{y}.png'},
  arcgis: {nama:'ArcGIS REST (MapServer)',
           contoh:'https://geoservices.contoh.go.id/arcgis/rest/services/NAMA/MapServer'},
  wms:    {nama:'WMS (OGC)',
           contoh:'https://server-anda.id/geoserver/wms'}
};

/**
 * Rapikan alamat ArcGIS REST menjadi pola ubin yang dimengerti Leaflet.
 * Menerima alamat sampai /MapServer maupun yang sudah lengkap.
 * Mengembalikan '' bila jelas bukan alamat ArcGIS REST.
 */
function urlArcgisUbin(url){
  var u = String(url || '').trim().replace(/\/+$/, '');
  if(!/^https?:\/\//i.test(u)) return '';

  /* sudah memuat pola ubin — pakai apa adanya */
  if(/\{z\}/i.test(u) && /\{x\}/i.test(u) && /\{y\}/i.test(u)) return u;

  /* buang ekor yang sering ikut tersalin dari peramban */
  u = u.replace(/\/(export|exportImage|tile|WMTS)(\/.*)?$/i, '');

  if(/\/MapServer$/i.test(u) || /\/ImageServer$/i.test(u)){
    return u + '/tile/{z}/{y}/{x}';
  }
  return '';
}

/** Pecah alamat WMS menjadi alamat dasar dan daftar lapisannya. */
function uraiWms(url, lapisan){
  var u = String(url || '').trim();
  if(!/^https?:\/\//i.test(u)) return null;

  var nama = String(lapisan || '').trim();
  var tanya = u.indexOf('?');

  /* Bila pengguna menempel URL GetMap lengkap, ambil layers dari sana. */
  if(tanya >= 0){
    var q = u.slice(tanya + 1);
    u = u.slice(0, tanya);
    var m = q.match(/(?:^|&)layers=([^&]+)/i);
    if(m && !nama) nama = decodeURIComponent(m[1]);
  }
  if(!nama) return null;
  return {url:u, layers:nama};
}

function basemapDefs(){
  var out = {
    grid: {nama:'Peta Grid (tanpa internet)', jenis:'grid',
           kredit:'Peta grid lokal — tanpa layanan pihak ketiga'}
  };

  var kode = String(S.settings.petaPenyedia || '').trim();
  var kunci = String(S.settings.petaKunci || '').trim();

  if(kode === 'kustom'){
    var u = String(S.settings.petaUrlKustom || '').trim();
    var jenis = String(S.settings.petaJenisKustom || 'xyz').trim();
    var dasar = {
      nama: S.settings.petaNamaKustom || 'Peta Kustom',
      maxNativeZoom: Number(S.settings.petaZoomKustom) || 19,
      kredit: S.settings.petaKreditKustom || 'Sumber peta milik pengguna'
    };

    if(jenis === 'arcgis'){
      var ua = urlArcgisUbin(u);
      if(ua){ dasar.url = ua; dasar.jenis = 'xyz'; out.kustom = dasar; }

    }else if(jenis === 'wms'){
      var w = uraiWms(u, S.settings.petaLapisanKustom);
      if(w){
        dasar.jenis = 'wms';
        dasar.url = w.url;
        dasar.layers = w.layers;
        out.kustom = dasar;
      }

    }else if(/^https?:\/\//i.test(u)){
      dasar.url = u; dasar.jenis = 'xyz'; out.kustom = dasar;
    }
  }else if(PENYEDIA_PETA[kode] && kunci){
    var set = PENYEDIA_PETA[kode].peta(kunci);
    for(var k in set) if(set.hasOwnProperty(k)) out[k] = set[k];
  }
  return out;
}

/** Benar bila peta dasar daring belum disiapkan pemilik sistem. */
function petaDasarBelumDisetel(){
  return Object.keys(basemapDefs()).length <= 1;
}

/**
 * PETA GRID — lapisan yang digambar sendiri di perangkat.
 *
 * Bukan sekadar layar kosong: menggambar kisi berjarak tetap dalam meter
 * beserta angka koordinatnya, sehingga bidang persil dan posisi petugas tetap
 * punya rujukan ruang walau tidak ada citra sama sekali. Tanpa server, tanpa
 * kuota, tanpa ketentuan pihak mana pun.
 */
function buatLapisanGrid(){
  if(typeof L === 'undefined') return null;

  var Grid = L.GridLayer.extend({
    createTile: function(coords){
      var ubin = document.createElement('canvas');
      var n = this.getTileSize();
      ubin.width = n.x; ubin.height = n.y;
      var g = ubin.getContext('2d');

      // latar
      g.fillStyle = '#eef2f7';
      g.fillRect(0, 0, n.x, n.y);

      // batas ubin
      g.strokeStyle = '#cbd5e1';
      g.lineWidth = 1;
      g.strokeRect(0.5, 0.5, n.x - 1, n.y - 1);

      // kisi dalam ubin
      g.strokeStyle = '#dbe3ec';
      var langkah = n.x / 4;
      for(var i = 1; i < 4; i++){
        g.beginPath();
        g.moveTo(i * langkah, 0); g.lineTo(i * langkah, n.y);
        g.moveTo(0, i * langkah); g.lineTo(n.x, i * langkah);
        g.stroke();
      }

      // koordinat sudut kiri-atas ubin
      try{
        var pusat = this._map.unproject(
          [coords.x * n.x, coords.y * n.y], coords.z);
        g.fillStyle = '#94a3b8';
        g.font = '10px system-ui, sans-serif';
        g.fillText(pusat.lat.toFixed(4) + ', ' + pusat.lng.toFixed(4), 6, 14);
      }catch(e){}

      return ubin;
    }
  });

  return new Grid({maxZoom: ZOOM_MAKS, attribution: 'Peta grid lokal'});
}

/* Peta aksi → koleksi & operasi, dipakai untuk menerapkan perubahan
   ke state lokal saat perangkat sedang offline. */
var LOCAL_MAP = {
  warga_add:        {coll:'warga',      op:'add',  pfx:'W'},
  warga_update:     {coll:'warga',      op:'upd'},
  warga_delete:     {coll:'warga',      op:'del'},
  pengurus_add:     {coll:'pengurus',   op:'add',  pfx:'PENG'},
  pengurus_update:  {coll:'pengurus',   op:'upd'},
  pengurus_delete:  {coll:'pengurus',   op:'del'},
  iuran_add:        {coll:'iuran',      op:'add',  pfx:'IU'},
  kas_add:          {coll:'kas',        op:'add',  pfx:'KAS'},
  aset_add:         {coll:'aset',       op:'add',  pfx:'AST'},
  aset_update:      {coll:'aset',       op:'upd'},
  aset_delete:      {coll:'aset',       op:'del'},
  pengaduan_add:    {coll:'pengaduan',  op:'add',  pfx:'PGD'},
  pengumuman_add:   {coll:'pengumuman', op:'add',  pfx:'ANN'},
  pengumuman_update:{coll:'pengumuman', op:'upd'},
  pengumuman_delete:{coll:'pengumuman', op:'del'},
  diskusi_update:   {coll:'diskusi',    op:'upd'},
  diskusi_delete:   {coll:'diskusi',    op:'del'},
  patroli_checkin:  {coll:'patroli',    op:'upd'},
  anggota_add:      {coll:'anggota',    op:'add',  pfx:'AGT'},
  anggota_update:   {coll:'anggota',    op:'upd'},
  anggota_delete:   {coll:'anggota',    op:'del'},
  bidang_add:       {coll:'bidang',     op:'add',  pfx:'BDG'},
  bidang_update:    {coll:'bidang',     op:'upd'},
  bidang_delete:    {coll:'bidang',     op:'del'},
  cctv_add:         {coll:'cctv',       op:'add',  pfx:'CAM'},
  cctv_update:      {coll:'cctv',       op:'upd'},
  cctv_delete:      {coll:'cctv',       op:'del'},
  sos_trigger:      {coll:'panic',      op:'add',  pfx:'SOS'},
  sos_resolve:      {coll:'panic',      op:'upd'}
};

function applyLocal(action, p){
  var m = LOCAL_MAP[action];
  if(m){
    var list = S[m.coll] || [];
    if(m.op === 'add'){
      var o = JSON.parse(JSON.stringify(p));
      o.id = o.id || tempId(m.pfx);
      o._pending = true;
      if(action==='pengaduan_add'){ o.status='Diajukan'; o.tanggalDibuat=nowStamp(); o.tanggalUpdate=nowStamp(); }
      if(action==='sos_trigger'){ o.status='Darurat Aktif'; o.timestamp=nowStamp(); }
      if(action==='iuran_add'){ o.status='Belum Bayar'; }
      if(action==='kas_add' && !o.tanggal) o.tanggal = todayStr();
      if(action==='pengumuman_add'){ o.dibacaCount=1; }
      if(action==='warga_add'){ o.points=100; o.qrCodeToken='RT05-OFFLINE-'+Date.now(); }
      list.push(o);
      S[m.coll] = list;
      return o;
    }
    if(m.op === 'upd'){
      for(var i=0;i<list.length;i++) if(list[i].id === p.id){
        for(var k in p) if(p.hasOwnProperty(k)) list[i][k]=p[k];
        list[i]._pending = true;
        if(action==='patroli_checkin'){ list[i].jamPatroliTerakhir=nowStamp(); if(!p.status) list[i].status='Sedang Dipatroli'; }
        return list[i];
      }
      return null;
    }
    if(m.op === 'del'){
      S[m.coll] = list.filter(function(x){ return x.id !== p.id; });
      return {id:p.id};
    }
  }
  /* aksi khusus */
  if(action === 'iuran_pay'){
    for(var a=0;a<S.iuran.length;a++) if(S.iuran[a].id===p.id){
      var b = S.iuran[a];
      b.status='Lunas'; b.metodeBayar=p.metode||'Tunai'; b.tanggalBayar=nowStamp();
      b.invoiceNo='INV/OFFLINE/'+Math.floor(100+Math.random()*900); b._pending=true;
      S.kas.push({id:tempId('KAS'),tanggal:todayStr(),jenis:'Pemasukan',nominal:b.nominal,
        kategori:'Iuran Warga',keterangan:'Pembayaran Iuran '+b.bulan+' '+b.tahun+' — '+b.wargaNama,
        dicatatOleh:'Offline WargaNet',referensiIuranId:b.id,_pending:true});
      return b;
    }
  }
  if(action === 'diskusi_add'){
    var t = JSON.parse(JSON.stringify(p));
    t.id = tempId('DSK'); t.timestamp = nowStamp(); t.likesCount = 1; t.balasan = []; t._pending = true;
    S.diskusi.push(t); return t;
  }
  if(action === 'diskusi_like'){
    for(var d=0;d<S.diskusi.length;d++) if(S.diskusi[d].id===p.id){
      S.diskusi[d].likesCount = (Number(S.diskusi[d].likesCount)||0)+1; return S.diskusi[d];
    }
  }
  if(action === 'balasan_add'){
    for(var e=0;e<S.diskusi.length;e++) if(S.diskusi[e].id===p.threadId){
      S.diskusi[e].balasan = S.diskusi[e].balasan||[];
      var b2 = JSON.parse(JSON.stringify(p)); b2.id=tempId('BAL'); b2.timestamp=nowStamp(); b2._pending=true;
      S.diskusi[e].balasan.push(b2); return b2;
    }
  }
  if(action === 'balasan_update' || action === 'balasan_delete'){
    for(var f=0;f<S.diskusi.length;f++){
      var bl = S.diskusi[f].balasan||[];
      for(var g=0;g<bl.length;g++) if(bl[g].id===p.id){
        if(action==='balasan_delete') S.diskusi[f].balasan = bl.filter(function(x){return x.id!==p.id;});
        else bl[g].isi = p.isi;
        return {id:p.id};
      }
    }
  }
  if(action === 'pengaduan_status'){
    for(var h=0;h<S.pengaduan.length;h++) if(S.pengaduan[h].id===p.id){
      S.pengaduan[h].status=p.status; S.pengaduan[h].tanggalUpdate=nowStamp();
      if(p.tanggapanPengurus) S.pengaduan[h].tanggapanPengurus=p.tanggapanPengurus;
      S.pengaduan[h]._pending=true; return S.pengaduan[h];
    }
  }
  if(action === 'aset_borrow'){
    for(var i2=0;i2<S.aset.length;i2++) if(S.aset[i2].id===p.id){
      S.aset[i2].status='Dipinjam'; S.aset[i2].peminjamNama=p.peminjamNama;
      S.aset[i2].tanggalPinjam=todayStr(); S.aset[i2].deadlineKembali=p.deadlineKembali||'';
      S.aset[i2]._pending=true; return S.aset[i2];
    }
  }
  if(action === 'aset_return'){
    for(var j=0;j<S.aset.length;j++) if(S.aset[j].id===p.id){
      S.aset[j].status='Tersedia'; S.aset[j].peminjamNama=''; S.aset[j].tanggalPinjam='';
      S.aset[j].deadlineKembali=''; S.aset[j]._pending=true; return S.aset[j];
    }
  }
  if(action === 'voting_create'){
    var v = JSON.parse(JSON.stringify(p)); v.id=tempId('VOTE'); v.status='Aktif'; v.totalKKSuara=0;
    v.voterLogs=[]; v._pending=true;
    v.opsi = (p.opsi||[]).map(function(t,i){ return {id:v.id+'-OPT'+(i+1),sessionId:v.id,teks:(typeof t==='string'?t:t.teks),jumlahSuara:0}; });
    S.voting.push(v); return v;
  }
  if(action === 'voting_cast'){
    for(var k2=0;k2<S.voting.length;k2++) if(S.voting[k2].id===p.sessionId){
      var ses = S.voting[k2];
      (ses.opsi||[]).forEach(function(o){ if(o.id===p.optionId) o.jumlahSuara=(Number(o.jumlahSuara)||0)+1; });
      ses.voterLogs = ses.voterLogs||[];
      ses.voterLogs.push({wargaId:p.wargaId,wargaNama:p.wargaNama,optionId:p.optionId,timestamp:nowStamp()});
      ses.totalKKSuara = (Number(ses.totalKKSuara)||0)+1;
      return ses;
    }
  }
  if(action === 'settings_update'){
    for(var s in p) if(p.hasOwnProperty(s) && s!=='aktorNama' && s!=='peran') S.settings[s]=p[s];
    return S.settings;
  }
  return null;
}

/* Aksi yang tidak boleh diantrikan offline (butuh server / tidak idempoten). */
var ONLINE_ONLY = {verify_pin:1, iuran_generate:1, iuran_reminder:1,
                   ai_financial_summary:1, ai_complaint:1, ai_assistant:1, bootstrap:1,
                   foto_upload:1, patroli_sesi_start:1, patroli_sesi_stop:1,
                   patroli_ping:1, patroli_live:1,
                   kartu_buka:1, kartu_pin_ubah:1, kartu_pin_reset:1, kartu_pin_status:1,
                   lisensi_status:1, lisensi_aktifkan:1, lisensi_hapus:1};

/**
 * Titik masuk tunggal semua mutasi.
 * Online  → kirim ke server lalu segarkan cache.
 * Offline → terapkan ke state lokal + masuk antrian outbox.
 */
function mutate(action, payload, opts){
  opts = opts || {};
  var p = payload || {};
  p.aktorNama = (S.me && S.me.nama) ? S.me.nama : 'Pengguna';
  p.peran = isPengurus() ? 'Pengurus RT' : 'Warga';

  if(!S.online && !ONLINE_ONLY[action]){
    var local = applyLocal(action, p);
    S.outbox.push({localId:tempId('Q'), action:action, payload:p, at:nowStamp()});
    saveOutbox(); saveCache(); render(); updateNetBar();
    toast('Tersimpan offline — akan dikirim saat online.', 'info');
    return Promise.resolve(local);
  }

  return callServer(action, p).then(function(res){
    if(opts.silent !== true) toast(opts.okMsg || 'Tersimpan.', 'ok');
    return refresh().then(function(){ return res; });
  }).catch(function(err){
    if(!ONLINE_ONLY[action] && /menghubungi|Failed|network|Load failed/i.test(err.message)){
      S.online = false;
      var l2 = applyLocal(action, p);
      S.outbox.push({localId:tempId('Q'), action:action, payload:p, at:nowStamp()});
      saveOutbox(); saveCache(); render(); updateNetBar();
      toast('Jaringan putus — perubahan diantrikan.', 'info');
      return l2;
    }
    toast(err.message, 'err');
    throw err;
  });
}

/* ---------- sinkronisasi outbox ---------- */
var syncing = false;
function flushOutbox(){
  if(syncing || !S.online || !S.outbox.length) return Promise.resolve();
  syncing = true;
  updateNetBar();
  var batch = S.outbox.slice(0, 40);
  var batchIds = {};
  batch.forEach(function(q){ batchIds[q.localId] = 1; });
  return callServer('sync_batch', {items:batch}).then(function(res){
    var results = (res && res.results) || [];
    var sukses = 0, gagal = 0, pesan = '';
    results.forEach(function(r){
      if(r.ok) sukses++;
      else { gagal++; if(!pesan) pesan = r.error || 'Gagal.'; }
    });
    /* Seluruh isi batch dikeluarkan dari antrian: yang berhasil sudah tersimpan di server,
       yang gagal ditolak server (mis. suara ganda) dan tidak akan berhasil bila diulang. */
    S.outbox = S.outbox.filter(function(q){ return !batchIds[q.localId]; });
    saveOutbox();
    syncing = false;
    if(sukses) toast(sukses + ' perubahan offline berhasil disinkronkan.', 'ok');
    if(gagal)  toast(gagal + ' perubahan ditolak server: ' + pesan, 'err');
    return refresh();
  }).catch(function(){
    syncing = false;
    updateNetBar();
  });
}

/* ---------- refresh dari server ---------- */
function refresh(){
  return callServer('bootstrap', {}).then(function(d){
    applyBootstrap(d, false);
    S.ready = true;
    render();
    updateNetBar();
    return d;
  }).catch(function(err){
    S.online = false;
    updateNetBar();
    if(!S.ready){ S.ready = true; render(); }
    throw err;
  });
}

function updateNetBar(){
  var el = $('netbar');
  if(!el) return;
  el.className = '';
  if(syncing){ el.className='on sync'; el.textContent='⟳ Menyinkronkan '+S.outbox.length+' perubahan offline…'; return; }
  if(!S.online){
    el.className='on';
    el.textContent = '⚡ MODE OFFLINE — data dari penyimpanan lokal'+
      (S.outbox.length? ' • '+S.outbox.length+' perubahan menunggu dikirim':'');
    return;
  }
  if(S.outbox.length){
    el.className='on';
    el.textContent = '⏳ '+S.outbox.length+' perubahan menunggu sinkronisasi — ketuk untuk kirim sekarang';
    el.style.cursor='pointer';
    el.onclick = flushOutbox;
    return;
  }
  el.textContent='';
}

window.addEventListener('online', function(){ S.online=true; updateNetBar(); flushOutbox().then(refresh).catch(function(){}); });
window.addEventListener('offline', function(){ S.online=false; updateNetBar(); render(); });

/**

    } else if(f.t === 'select'){
      h += '<select class="inp" id="f_'+f.k+'"'+(f.onchange?' onchange="'+f.onchange+'"':'')+'>';

      opsi.forEach(function(o){
        h += '<option value="'+esc(o.v)+'"'+(String(v)===String(o.v)?' selected':'')+'>'+esc(o.l)+'</option>';
      });

    } else if(f.t === 'aksi'){

           'style="width:56px;height:38px;border:2px solid #000;padding:2px;background:#fff">'+
           '<span class="sub">Warna isian bidang di peta</span></div>';
    } else if(f.t === 'foto'){

                 (v?'<button type="button" class="fotobtn" onclick="hapusFotoField(\''+jsq(f.k)+'\')">✕ Hapus</button>':'')+
               '</div>'+

    }

    '<button class="btn" onclick="closeModal()">Batal</button>'+
    '<button class="btn dark" id="btnSimpanForm" onclick="submitForm()">Simpan</button>', wide);

  /* Dua jalur masuk untuk tiap ruas foto: kamera langsung dan galeri.
     Atribut capture="environment" membuat HP membuka kamera belakang seketika,
     sementara tombol galeri sengaja tanpa capture agar pemilih berkas muncul. */
  fields.forEach(function(f){
    if(f.t !== 'foto') return;
    ['fp_cam_', 'fp_file_'].forEach(function(pfx){
      var inp = $(pfx + f.k);
      if(!inp) return;
      inp.onchange = function(){
        unggahFotoField(f.k, this.files && this.files[0], f);
        this.value = '';       // izinkan memilih berkas sama dua kali berturut-turut
      };
    });
  });

/* ---------- unggah foto dari dalam formulir ---------- */
function unggahFotoField(key, file, f){
  if(!file) return;
  f = f || {};
  var maxPx = f.bukti ? 1280 : 640;
  var mutu  = f.bukti ? 0.72 : 0.78;
  var hint = $('fp_hint_'+key), prev = $('fp_prev_'+key), tombol = $('btnSimpanForm');
  function pesan(t){ if(hint) hint.textContent = t; }

  if(!S.online){ pesan('Perlu koneksi internet untuk mengunggah foto.'); toast('Unggah foto memerlukan koneksi.','err'); return; }

  pesan('Memperkecil gambar…');
  if(tombol) tombol.disabled = true;

  kecilkanGambar(file, maxPx, mutu).then(function(dataUrl){
    if(prev){
      prev.innerHTML = f.bukti
        ? '<img class="fotoprev kecil" src="'+dataUrl+'" alt="pratinjau bukti">'
        : '<div class="ava"><img src="'+dataUrl+'" alt="pratinjau"></div>';
    }
    pesan('Mengunggah ke Google Drive…');
    return callServer('foto_upload', {dataUrl:dataUrl, nama:(_formCb && _formCb.nama) || 'foto'});
  }).then(function(res){
    var el = $('f_'+key);
    if(el) el.value = res.fotoUrl || res.fileId || '';
    pesan('Foto siap disimpan. Tekan Simpan untuk menerapkan.');
    if(tombol) tombol.disabled = false;
    toast('Foto terunggah.','ok');
  }).catch(function(err){
    pesan(err.message || 'Gagal mengunggah foto.');
    if(tombol) tombol.disabled = false;
    toast(err.message || 'Gagal mengunggah foto.','err');
  });
}

function hapusFotoField(key){
  var el = $('f_'+key); if(el) el.value = '';
  var prev = $('fp_prev_'+key); if(prev) prev.innerHTML = '<div class="ava">🖼️</div>';
  var hint = $('fp_hint_'+key); if(hint) hint.textContent = 'Foto dikosongkan. Tekan Simpan untuk menerapkan.';
}

/* ============================================================
 * LIGHTBOX — perbesar foto profil (roda mouse, cubit layar, geser)
 * ============================================================ */
var ZOOM = {sk:1, x:0, y:0, drag:false, px:0, py:0, pinch:0, psk:1};

function zoomFoto(foto, judul){
  var src = fotoSrc(foto, 1600);
  if(!src){ toast('Belum ada foto untuk ditampilkan.','info'); return; }
  ZOOM = {sk:1, x:0, y:0, drag:false, px:0, py:0, pinch:0, psk:1};

  var box = document.createElement('div');
  box.className = 'lbox'; box.id = 'lbox';
  box.innerHTML =
    '<div class="stage" id="lstage"><img id="limg" src="'+esc(src)+'" alt="'+esc(judul||'Foto')+'"></div>'+
    '<div class="lbar">'+
      '<span class="lcap">'+esc(judul||'Foto profil')+'</span>'+
      '<button class="btn sm" onclick="zoomBy(-0.35)">−</button>'+
      '<button class="btn sm" id="lzlabel" onclick="zoomReset()">100%</button>'+
      '<button class="btn sm" onclick="zoomBy(0.35)">+</button>'+
      '<a class="btn sm" href="'+esc(src)+'" target="_blank" rel="noopener">Buka Asli</a>'+
      '<button class="btn sm dark" onclick="tutupZoom()">Tutup</button>'+
    '</div>';
  document.body.appendChild(box);

  var stage = $('lstage'), img = $('limg');

  img.onload = function(){
    var maxW = stage.clientWidth - 24, maxH = stage.clientHeight - 24;
    var sk = Math.min(maxW/img.naturalWidth, maxH/img.naturalHeight, 1);
    img.style.width = Math.max(60, Math.round(img.naturalWidth*sk)) + 'px';
    img.style.height = 'auto';
    zoomTerap();
  };
  img.onerror = function(){
    stage.innerHTML = '<div style="color:#fff;font-weight:800;padding:24px;text-align:center">'+
      'Foto tidak dapat dimuat.<br><span style="font-weight:600;font-size:12px">'+
      'Periksa koneksi, atau pastikan berkas Drive dibagikan sebagai “siapa saja yang memiliki tautan”.</span></div>';
  };

  stage.addEventListener('wheel', function(e){
    e.preventDefault(); zoomBy(e.deltaY < 0 ? 0.2 : -0.2);
  }, {passive:false});

  stage.addEventListener('mousedown', function(e){
    ZOOM.drag = true; ZOOM.px = e.clientX; ZOOM.py = e.clientY; stage.classList.add('grab');
  });
  window.addEventListener('mousemove', zoomGeser);
  window.addEventListener('mouseup', zoomLepas);

  stage.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){
      ZOOM.pinch = zoomJarakSentuh(e); ZOOM.psk = ZOOM.sk;
    }else if(e.touches.length === 1){
      ZOOM.drag = true; ZOOM.px = e.touches[0].clientX; ZOOM.py = e.touches[0].clientY;
    }
  }, {passive:true});

  stage.addEventListener('touchmove', function(e){
    if(e.touches.length === 2 && ZOOM.pinch){
      e.preventDefault();
      var d = zoomJarakSentuh(e);
      ZOOM.sk = Math.min(6, Math.max(0.4, ZOOM.psk * (d/ZOOM.pinch)));
      zoomTerap();
    }else if(e.touches.length === 1 && ZOOM.drag){
      e.preventDefault();
      var t = e.touches[0];
      ZOOM.x += t.clientX - ZOOM.px; ZOOM.y += t.clientY - ZOOM.py;
      ZOOM.px = t.clientX; ZOOM.py = t.clientY;
      zoomTerap();
    }
  }, {passive:false});

  stage.addEventListener('touchend', function(e){
    if(e.touches.length < 2) ZOOM.pinch = 0;
    if(e.touches.length === 0) ZOOM.drag = false;
  }, {passive:true});

  box.addEventListener('mousedown', function(e){ if(e.target === box) tutupZoom(); });
  document.addEventListener('keydown', zoomTombol);
}

function zoomJarakSentuh(e){
  var a = e.touches[0], b = e.touches[1];
  return Math.sqrt(Math.pow(a.clientX-b.clientX,2) + Math.pow(a.clientY-b.clientY,2));
}
function zoomGeser(e){
  if(!ZOOM.drag) return;
  ZOOM.x += e.clientX - ZOOM.px; ZOOM.y += e.clientY - ZOOM.py;
  ZOOM.px = e.clientX; ZOOM.py = e.clientY;
  zoomTerap();
}
function zoomLepas(){
  ZOOM.drag = false;
  var st = $('lstage'); if(st) st.classList.remove('grab');
}
function zoomBy(d){ ZOOM.sk = Math.min(6, Math.max(0.4, ZOOM.sk + d)); zoomTerap(); }
function zoomReset(){ ZOOM.sk = 1; ZOOM.x = 0; ZOOM.y = 0; zoomTerap(); }
function zoomTerap(){
  var img = $('limg'); if(!img) return;
  img.style.transform = 'translate('+ZOOM.x+'px,'+ZOOM.y+'px) scale('+ZOOM.sk+')';
  var lb = $('lzlabel'); if(lb) lb.textContent = Math.round(ZOOM.sk*100)+'%';
}
function zoomTombol(e){
  if(e.key === 'Escape') tutupZoom();
  else if(e.key === '+' || e.key === '=') zoomBy(0.25);
  else if(e.key === '-') zoomBy(-0.25);
  else if(e.key === '0') zoomReset();
}
function tutupZoom(){
  var b = $('lbox'); if(b) b.parentNode.removeChild(b);
  window.removeEventListener('mousemove', zoomGeser);
  window.removeEventListener('mouseup', zoomLepas);
  document.removeEventListener('keydown', zoomTombol);
}

function submitForm(){
  if(!_formCb) return;
  var out = {}, miss = null;
  _formCb.fields.forEach(function(f){
    var el = $('f_'+f.k); if(!el) return;
    var v = (f.t==='checkbox') ? el.checked : el.value;
    if(f.t==='number') v = Number(v)||0;
    if(f.req && (v==='' || v===null)) miss = miss || f.l;
    out[f.k] = v;
  });
  if(miss){ toast('Wajib diisi: '+miss, 'err'); return; }

  /* Formulir ditutup SETELAH penangannya berjalan. Bila penangan
     mengembalikan false — artinya ada isian yang belum sah — jendela
     dibiarkan terbuka supaya pengguna tidak kehilangan ketikannya. */
  var cb = _formCb.cb;
  var hasil = cb(out);
  if(hasil !== false) closeModal();
}

function statIuran(){
  var lunas=0, belum=0, telat=0, totalMasuk=0, tagih=0;
  S.iuran.forEach(function(i){
    if(i.status==='Lunas'){ lunas++; totalMasuk += Number(i.nominal)||0; }
    else if(i.status==='Terlambat'){ telat++; tagih += Number(i.nominal)||0; }
    else { belum++; tagih += Number(i.nominal)||0; }
  });
  return {lunas:lunas,belum:belum,telat:telat,totalMasuk:totalMasuk,tagih:tagih,
          total:S.iuran.length, persen: S.iuran.length? Math.round(lunas/S.iuran.length*100):0};
}
function statKas(){
  var masuk=0, keluar=0;
  S.kas.forEach(function(k){
    if(k.jenis==='Pemasukan') masuk += Number(k.nominal)||0; else keluar += Number(k.nominal)||0;
  });
  return {masuk:masuk, keluar:keluar, saldo:masuk-keluar};
}

/* ============================================================
 * ANGGOTA KELUARGA — jiwa yang menginduk pada satu kepala keluarga
 * ============================================================ */

var HUBUNGAN = ['Istri', 'Suami', 'Anak', 'Menantu', 'Cucu', 'Orang Tua', 'Mertua',
                'Famili Lain', 'Pembantu', 'Lainnya'];
var STATUS_TINGGAL = ['Tinggal di Sini', 'Merantau / Kos', 'Sementara', 'Sudah Pindah'];

/* ---------- status rumah ---------- */
var STATUS_RUMAH = ['Dihuni', 'Kosong - Dicari Penyewa', 'Kosong - Dijual',
                    'Kosong - Ditinggal Pemilik', 'Bukan Rumah Tinggal'];
var PERAN_KONTAK = ['', 'Agen/Broker', 'Kerabat/Titipan', 'Pengelola', 'Tetangga', 'Lainnya'];

/** Benar bila rumah tidak sedang dihuni. Data lama tanpa status = dianggap dihuni. */
function rumahKosong(w){
  var st = String((w && w.statusRumah) || '').trim();
  return !!st && st !== 'Dihuni';
}

function badgeRumah(w){
  if(!rumahKosong(w)) return '';
  var st = w.statusRumah;
  var warna = /Dijual/i.test(st) ? 'b-violet' : /Penyewa/i.test(st) ? 'b-yellow' : 'b-gray';
  return '<span class="badge '+warna+'" title="Rumah tidak berpenghuni">🏚️ '+esc(st)+'</span>';
}

/**
 * Siapa yang layak dihubungi untuk satu rumah.
 * Rumah berpenghuni → kepala keluarga. Rumah kosong → pemiliknya, dan bila
 * pemilik tinggal di luar daerah, kontak alternatif (agen/kerabat) ikut disertakan.
 */
function kontakRumah(w){
  var out = [];
  if(!rumahKosong(w)){
    if(w.noHp) out.push({nama:w.nama, noHp:w.noHp, peran:'Kepala Keluarga'});
  }else{
    if(w.pemilikNoHp) out.push({nama:w.pemilikNama||'Pemilik', noHp:w.pemilikNoHp,
                                peran:'Pemilik'+(w.pemilikDomisili?' — '+w.pemilikDomisili:'')});
    if(w.kontakAltNoHp) out.push({nama:w.kontakAltNama||'Kontak lain', noHp:w.kontakAltNoHp,
                                  peran:w.kontakAltPeran||'Kontak alternatif'});
    if(!out.length && w.noHp) out.push({nama:w.nama, noHp:w.noHp, peran:'Kontak terdaftar'});
  }
  return out;
}

/** Deretan tombol Telepon + WhatsApp untuk satu nomor. */
function tombolKontak(nama, noHp, kecil){
  var sz = kecil ? ' sm' : '';
  var h = '';
  if(nomorTel(noHp)){
    h += '<a class="btn'+sz+'" href="tel:'+esc(nomorTel(noHp))+'" '+
         'style="text-decoration:none;color:inherit" title="Telepon '+esc(nama)+'">📞 Telepon</a>';
  }
  if(nomorWa(noHp)){
    h += '<button class="btn'+sz+' green" onclick="waNomor(\''+jsq(nomorWa(noHp))+'\',\''+jsq(nama)+'\')" '+
         'title="Chat WhatsApp '+esc(nama)+'">💬 WhatsApp</button>';
  }
  return h;
}

/** Buka WhatsApp ke nomor mana pun dengan salam pembuka standar. */
function waNomor(nomor, nama){
  var pengirim = (S.me && S.me.nama) ? S.me.nama : 'warga';
  bukaWa(nomor, 'Assalamualaikum ' + (nama || '') + ', saya ' + pengirim +
                ' warga ' + (S.settings.namaRT || 'RT') + '.');
}

function anggotaDari(wargaId){
  return (S.anggota||[]).filter(function(a){ return a.wargaId === wargaId; });
}

/**
 * Jumlah jiwa = kepala keluarga + anggotanya.
 * Rumah kosong tidak punya kepala keluarga yang menghuni, jadi tidak
 * ditambah satu — aturan ini harus sama persis dengan sinkronJumlahJiwa()
 * di Code.gs, kalau tidak angka di layar berbeda dengan isi lembar kerja.
 */
function jumlahJiwa(w){
  var anggota = anggotaDari(w.id).length;
  return rumahKosong(w) ? anggota : anggota + 1;
}

function umurDari(tgl){
  if(!tgl) return '';
  var d = new Date(tgl);
  if(isNaN(d.getTime())) return '';
  var kini = new Date();
  var th = kini.getFullYear() - d.getFullYear();
  var m = kini.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && kini.getDate() < d.getDate())) th--;
  if(th < 0 || th > 130) return '';
  return th + ' th';
}

function ikonKelamin(jk){
  if(/laki/i.test(jk||'')) return '♂';
  if(/perempuan|wanita/i.test(jk||'')) return '♀';
  return '•';
}

/** Isi kolom Kontak pada tabel warga, lengkap dengan tombol telepon & WA. */
function kolomKontak(w){
  var daftar = kontakRumah(w);
  if(!daftar.length){
    return '<span class="sub">Belum ada nomor'+
      (rumahKosong(w) ? ' — isi kontak pemilik lewat Edit' : '')+'</span>';
  }
  return daftar.map(function(k){
    return '<div style="margin-bottom:6px">'+
      '<div style="font-size:12px;font-weight:800">'+esc(k.noHp)+'</div>'+
      '<div class="sub">'+esc(k.peran)+'</div>'+
      '<div class="row" style="margin-top:4px">'+tombolKontak(k.nama, k.noHp, true)+'</div>'+
    '</div>';
  }).join('') + (!rumahKosong(w) && w.email
    ? '<div class="sub">'+esc(w.email)+'</div>' : '');
}

/** Jendela daftar anggota satu keluarga. */
function daftarAnggota(wargaId){
  var w = S.warga.filter(function(x){ return x.id === wargaId; })[0];
  if(!w){ toast('Data warga tidak ditemukan.','err'); return; }
  openModal('Anggota Keluarga — '+esc(w.nama), isiDaftarAnggota(wargaId),
    '<button class="btn" onclick="closeModal()">Tutup</button>'+
    (isPengurus()
      ? '<button class="btn dark" onclick="formAnggota(\'' + jsq(wargaId) + '\')">+ Tambah Anggota</button>'
      : ''), true);
}

function isiDaftarAnggota(wargaId){
  var w = S.warga.filter(function(x){ return x.id === wargaId; })[0] || {};
  var list = anggotaDari(wargaId);

  if(rumahKosong(w)) return isiRumahKosong(w, list);

  var umurKk = umurDari(w.tanggalLahir);
  var h = '<div class="card flat" style="background:#111;color:#fff">'+
    '<div class="row" style="align-items:flex-start">'+
      avatarHtml(w.nama, w.fotoUrl, 'lg')+
      '<div style="flex:1;min-width:0">'+
        '<div class="spread" style="gap:6px"><b style="font-size:14px">'+esc(w.nama)+'</b>'+
          '<span class="badge b-blue">Kepala Keluarga</span></div>'+
        '<div class="sub" style="color:#cbd5e1;margin-top:3px">'+
          ikonKelamin(w.jenisKelamin)+' '+esc(w.jenisKelamin||'-')+
          (umurKk ? ' • '+esc(umurKk) : '')+
          (w.golonganDarah ? ' • Gol. '+esc(w.golonganDarah) : '')+'</div>'+
        '<div class="sub" style="color:#cbd5e1">NIK '+esc(w.nik||'-')+'</div>'+
        (w.tempatLahir || w.tanggalLahir
          ? '<div class="sub" style="color:#cbd5e1">'+esc(w.tempatLahir||'')+
            (w.tanggalLahir?', '+esc(w.tanggalLahir):'')+'</div>' : '')+
        (w.pekerjaan || w.pendidikan
          ? '<div class="sub" style="color:#cbd5e1">'+esc(w.pekerjaan||'-')+
            (w.pendidikan?' • '+esc(w.pendidikan):'')+'</div>' : '')+
        (w.statusPerkawinan
          ? '<div class="sub" style="color:#cbd5e1">'+esc(w.statusPerkawinan)+'</div>' : '')+
        '<div class="sub" style="color:#cbd5e1">'+esc(w.blok||'')+' '+esc(w.noRumah||'')+
          ' • '+esc(w.statusHunian||'')+'</div>'+
        (w.keterangan
          ? '<div class="sub" style="color:#cbd5e1;margin-top:4px">'+esc(w.keterangan)+'</div>' : '')+
        '<div class="row" style="margin-top:8px;flex-wrap:wrap">'+
          tombolKontak(w.nama, w.noHp, true)+
          (isPengurus()
            ? '<button class="btn sm blue" onclick="formWarga(\''+jsq(w.id)+'\')">Edit Kepala Keluarga</button>'
            : '')+
        '</div>'+
      '</div>'+
      '<div style="text-align:right"><div style="font-size:24px;font-weight:900">'+(list.length+1)+'</div>'+
        '<div style="font-size:9.5px;font-weight:900;letter-spacing:.5px">JIWA</div></div>'+
    '</div></div>';

  if(!list.length){
    return h + '<div class="empty">Belum ada anggota keluarga yang didata. '+
      (isPengurus()
        ? 'Tekan “Tambah Anggota” untuk mendaftarkan istri, anak, orang tua, atau penghuni lain.'
        : 'Hubungi pengurus RT bila data keluarga Anda perlu dilengkapi.')+'</div>';
  }

  /* Ringkasan komposisi — kepala keluarga ikut dihitung, karena angka
     di atas juga menyebut dirinya sebagai salah satu jiwa. */
  var semua = [w].concat(list);
  var lk = semua.filter(function(a){ return /laki/i.test(a.jenisKelamin||''); }).length;
  var pr = semua.filter(function(a){ return /perempuan|wanita/i.test(a.jenisKelamin||''); }).length;
  var luar = list.filter(function(a){ return a.statusTinggal && a.statusTinggal !== 'Tinggal di Sini'; }).length;
  h += '<div class="row" style="flex-wrap:wrap;gap:6px">'+
    '<span class="badge b-blue">♂ '+lk+' laki-laki</span>'+
    '<span class="badge b-violet">♀ '+pr+' perempuan</span>'+
    (luar ? '<span class="badge b-yellow">'+luar+' tidak menetap</span>' : '')+
  '</div>';

  h += '<div class="stack">';
  list.forEach(function(a){
    var umur = umurDari(a.tanggalLahir);
    h += '<div class="card flat"><div class="row" style="align-items:flex-start">'+
      avatarHtml(a.nama, a.fotoUrl, 'lg')+
      '<div style="flex:1;min-width:0">'+
        '<div class="spread" style="gap:6px"><b style="font-size:13px">'+esc(a.nama)+'</b>'+
          '<span class="badge b-yellow">'+esc(a.hubungan||'Lainnya')+'</span></div>'+
        '<div class="sub" style="margin-top:3px">'+
          ikonKelamin(a.jenisKelamin)+' '+esc(a.jenisKelamin||'-')+
          (umur ? ' • '+esc(umur) : '')+
          (a.golonganDarah ? ' • Gol. '+esc(a.golonganDarah) : '')+
        '</div>'+
        '<div class="sub">NIK '+esc(a.nik||'-')+'</div>'+
        (a.tempatLahir || a.tanggalLahir
          ? '<div class="sub">'+esc(a.tempatLahir||'')+(a.tanggalLahir?', '+esc(a.tanggalLahir):'')+'</div>' : '')+
        (a.pekerjaan || a.pendidikan
          ? '<div class="sub">'+esc(a.pekerjaan||'-')+(a.pendidikan?' • '+esc(a.pendidikan):'')+'</div>' : '')+
        (a.statusPerkawinan ? '<div class="sub">'+esc(a.statusPerkawinan)+'</div>' : '')+
        (a.statusTinggal && a.statusTinggal !== 'Tinggal di Sini'
          ? '<div><span class="badge b-gray" style="margin-top:4px">'+esc(a.statusTinggal)+'</span></div>' : '')+
        (a.keterangan ? '<div class="sub" style="margin-top:4px">'+esc(a.keterangan)+'</div>' : '')+
        pendingMark(a)+
        '<div class="row" style="margin-top:8px;flex-wrap:wrap">'+
          (nomorTel(a.noHp)
            ? '<a class="btn sm" href="tel:'+esc(nomorTel(a.noHp))+'" style="text-decoration:none;color:inherit">📞 Telepon</a>'
            : '')+
          (nomorWa(a.noHp)
            ? '<button class="btn sm green" onclick="waAnggota(\'' + jsq(a.id) + '\')">💬 WhatsApp</button>'
            : '')+
          (isPengurus()
            ? '<button class="btn sm blue" onclick="formAnggota(\'' + jsq(a.wargaId) + '\',\'' + jsq(a.id) + '\')">Edit</button>'+
              '<button class="btn sm red" onclick="hapusAnggota(\'' + jsq(a.id) + '\')">Hapus</button>'
            : '')+
        '</div>'+
      '</div>'+
    '</div></div>';
  });
  h += '</div>';
  return h;
}

/**
 * Tampilan untuk rumah tanpa penghuni. Yang ditonjolkan bukan daftar jiwa —
 * memang tidak ada — melainkan siapa yang bisa dihubungi: pemiliknya, dan
 * bila pemilik berdomisili di luar, agen atau kerabat yang dititipi.
 */
function isiRumahKosong(w, list){
  var h = '<div class="card flat" style="background:#111;color:#fff">'+
    '<div class="row" style="align-items:flex-start">'+
      '<div class="ava lg" style="background:#334155">🏚️</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="spread" style="gap:6px"><b style="font-size:14px">'+esc(w.nama||'Rumah kosong')+'</b>'+
          badgeRumah(w)+'</div>'+
        '<div class="sub" style="color:#cbd5e1;margin-top:3px">'+esc(w.blok||'')+' '+esc(w.noRumah||'')+
          ' • '+esc(w.statusHunian||'')+'</div>'+
        (w.tanggalKosong
          ? '<div class="sub" style="color:#cbd5e1">Kosong sejak '+esc(w.tanggalKosong)+'</div>' : '')+
        (w.keterangan
          ? '<div class="sub" style="color:#cbd5e1;margin-top:4px">'+esc(w.keterangan)+'</div>' : '')+
        (isPengurus()
          ? '<div class="row" style="margin-top:8px">'+
            '<button class="btn sm blue" onclick="formWarga(\''+jsq(w.id)+'\')">Edit Data Rumah</button></div>'
          : '')+
      '</div>'+
      '<div style="text-align:right"><div style="font-size:24px;font-weight:900">0</div>'+
        '<div style="font-size:9.5px;font-weight:900;letter-spacing:.5px">JIWA</div></div>'+
    '</div></div>';

var _qrTimer = null;

function mulaiSegarQr(w){
  hentikanSegarQr();
  if(!w || !w.qrRahasia) return;

  _qrTimer = setInterval(function(){
    var kotak = $('qrKotak');
    if(!kotak){ hentikanSegarQr(); return; }          // kartu sudah ditutup
    kotak.innerHTML = qrSvg(muatanQrKartu(w), 180);

    var sisa = QR_DETIK_SLOT - (Math.floor(Date.now()/1000) % QR_DETIK_SLOT);
    var ket = $('qrHitung');
    if(ket) ket.textContent = 'Kode berubah dalam ' + sisa + ' detik';
  }, 1000);
}

function hentikanSegarQr(){
  if(_qrTimer){ clearInterval(_qrTimer); _qrTimer = null; }
}

/* ============================================================
 * PEMINDAI KARTU WARGA
 *
 * Dua jalur pembacaan, dicoba berurutan:
 *   1. BarcodeDetector bawaan peramban — paling ringan, tersedia di
 *      Chrome Android dan sebagian peramban desktop;
 *   2. pustaka jsQR yang ikut dalam bundel — dipakai bila yang pertama
 *      tidak ada, misalnya di Safari iOS.
 *
 * Bila kamera sama sekali tidak dapat dibuka, tersedia isian manual
 * supaya petugas tetap bisa memeriksa dengan mengetik kodenya.
 * ============================================================ */
var PINDAI = {aliran:null, jalan:false, detektor:null, terakhir:'', jedaSampai:0};
var _jsqrP = null;

function ensureJsQr(){
  if(typeof jsQR !== 'undefined') return Promise.resolve(jsQR);
  if(_jsqrP) return _jsqrP;

  _jsqrP = new Promise(function(resolve, reject){
    var el = document.getElementById('jsqrSrc');
    var src = el ? String(el.textContent || '') : '';
    if(src.length > 10000){
      try{
        var mod = {exports:{}};
        new Function('module','exports', src)(mod, mod.exports);
        window.jsQR = mod.exports.default || mod.exports;
        return resolve(window.jsQR);
      }catch(e){
        _jsqrP = null;
        return reject(new Error('Pembaca QR tertanam gagal dijalankan: ' + e.message));
      }
    }
    /* Bundel GitHub Pages menyimpannya sebagai berkas terpisah. */
    var sc = document.createElement('script');
    sc.src = 'lib/jsqr.min.js';
    sc.onload = function(){
      (typeof jsQR !== 'undefined')
        ? resolve(jsQR)
        : reject(new Error('Pembaca QR tidak dapat dimuat.'));
    };
    sc.onerror = function(){
      _jsqrP = null;
      reject(new Error('Pembaca QR tidak tersedia pada paket ini.'));
    };
    document.head.appendChild(sc);
  });
  return _jsqrP;
}

      '<div style="position:absolute;inset:18%;border:3px solid var(--acc);'+
        'box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none"></div>'+

      '<button class="btn sm dark" style="margin-top:6px" onclick="periksaIsiQr(document.getElementById(\'pindaiManual\').value, true)">Periksa</button>'+
    '</details>',

  setTimeout(mulaiKamera, 120);

function statusPindai(teks){
  var el = $('pindaiStatus');
  if(el) el.textContent = teks;
}

function mulaiKamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusPindai('Peramban ini tidak mendukung kamera. Gunakan isian manual di bawah.');
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: {facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960}},
    audio: false
  }).then(function(aliran){
    PINDAI.aliran = aliran;
    var v = $('pindaiVideo');
    if(!v){ hentikanKamera(); return; }
    v.srcObject = aliran;
    v.play().catch(function(){});
    PINDAI.jalan = true;

    if(typeof BarcodeDetector !== 'undefined'){
      try{ PINDAI.detektor = new BarcodeDetector({formats:['qr_code']}); }catch(e){ PINDAI.detektor = null; }
    }
    statusPindai(PINDAI.detektor
      ? 'Kamera siap. Arahkan ke kode QR.'
      : 'Kamera siap. Menyiapkan pembaca QR…');

    if(PINDAI.detektor) return putaranPindai();

    ensureJsQr()
      .then(function(){ statusPindai('Kamera siap. Arahkan ke kode QR.'); putaranPindai(); })
      .catch(function(err){ statusPindai(err.message + ' Gunakan isian manual di bawah.'); });
  }).catch(function(err){
    var pesan = (err && err.name === 'NotAllowedError')
      ? 'Izin kamera ditolak. Aktifkan izin kamera untuk situs ini, atau gunakan isian manual.'
      : 'Kamera tidak dapat dibuka: ' + (err && err.message ? err.message : 'tidak diketahui') +
        '. Gunakan isian manual di bawah.';
    statusPindai(pesan);
  });
}

function putaranPindai(){
  if(!PINDAI.jalan) return;
  var v = $('pindaiVideo');
  if(!v || v.readyState < 2){ return setTimeout(putaranPindai, 200); }

  var lanjut = function(){ if(PINDAI.jalan) setTimeout(putaranPindai, 220); };

  if(PINDAI.detektor){
    PINDAI.detektor.detect(v).then(function(kode){
      if(kode && kode.length) tanganiHasilPindai(kode[0].rawValue);
      lanjut();
    }).catch(lanjut);
    return;
  }

  try{
    var c = document.createElement('canvas');
    var lebar = Math.min(v.videoWidth || 640, 640);
    var tinggi = Math.round((v.videoHeight || 480) * lebar / (v.videoWidth || 640));
    c.width = lebar; c.height = tinggi;
    var cx = c.getContext('2d', {willReadFrequently:true});
    cx.drawImage(v, 0, 0, lebar, tinggi);
    var d = cx.getImageData(0, 0, lebar, tinggi);
    var hasil = jsQR(d.data, d.width, d.height, {inversionAttempts:'dontInvert'});
    if(hasil && hasil.data) tanganiHasilPindai(hasil.data);
  }catch(e){}
  lanjut();
}

/** Cegah satu kartu diperiksa berulang-ulang saat kamera masih menyorotnya. */
function tanganiHasilPindai(isi){
  var kini = Date.now();
  if(isi === PINDAI.terakhir && kini < PINDAI.jedaSampai) return;
  PINDAI.terakhir = isi;
  PINDAI.jedaSampai = kini + 2500;
  periksaIsiQr(isi, false);
}

function periksaIsiQr(isi, manual){
  isi = String(isi || '').trim();
  if(!isi){ toast('Belum ada kode yang dibaca.','err'); return; }

      sah:false, taraf:'luring',

    });

  statusPindai('Memeriksa…');
  callServer('kartu_verifikasi', {isi:isi, aktorNama:(S.me?S.me.nama:'Petugas')})
    .then(function(r){
      tampilkanHasilPindai(r);
      statusPindai(manual ? 'Selesai diperiksa.' : 'Kamera siap. Arahkan ke kode QR berikutnya.');
    })
    .catch(function(err){
      tampilkanHasilPindai({sah:false, taraf:'galat', pesan:err.message});
      statusPindai('Kamera siap.');

/**
 * Pintu masuk kartu digital.
 *
 * Pengurus dibukakan dengan PIN pengurus (dipakai saat verifikasi di pos jaga).
 * Warga wajib memasukkan PIN kartunya sendiri; setelah berhasil, kartu itu
 * tersimpan di perangkat ini sehingga dapat dibuka lagi tanpa sinyal.
 */
function kartuWarga(id){
  var w = S.warga.filter(function(x){return x.id===id;})[0];
  if(!w){ toast('Data warga tidak ditemukan.','err'); return; }

  if(isPengurus()){ bukaKartuPengurus(id); return; }

  var simpan = ambilKartu(id);
  if(simpan){ tampilkanKartu(segarkanKartu(simpan)); return; }

  mintaPinKartu(w);
}

/**
 * Gabungkan kartu tersimpan dengan data terbaru.
 *
 * Kartu disimpan di HP supaya bisa ditunjukkan tanpa sinyal, tetapi isinya
 * membeku pada saat PIN pertama kali diverifikasi. Akibatnya anggota keluarga
 * yang didata belakangan tidak pernah muncul, sehingga kartu versi warga dan
 * versi pengurus terlihat berbeda.
 *
 * Yang benar-benar perlu diambil dari kartu tersimpan hanyalah bagian yang
 * memerlukan PIN: token QR dan NIK utuh. Sisanya — termasuk daftar anggota —
 * selalu diambil dari data terbaru yang sudah ada di aplikasi.
 */
function segarkanKartu(kartu){
  if(!kartu || !kartu.id) return kartu;
  var w = S.warga.filter(function(x){ return x.id === kartu.id; })[0];
  if(!w) return kartu;                       // data warga belum termuat

  var out = {};
  for(var k in w) if(w.hasOwnProperty(k)) out[k] = w[k];

  /* Bagian rahasia: hanya ada pada kartu yang sudah lolos PIN.
     qrRahasia WAJIB ikut dipertahankan — tanpa itu kartu diam-diam
     kembali memakai token statis yang tidak pernah kedaluwarsa. */
  out.qrCodeToken = kartu.qrCodeToken;
  out.qrRahasia   = kartu.qrRahasia;
  out.pinBawaan   = kartu.pinBawaan;
  out.dibukaOleh  = kartu.dibukaOleh;
  if(kartu.nik && String(kartu.nik).indexOf('•') < 0) out.nik = kartu.nik;

  /* daftar anggota selalu yang terbaru; NIK utuh dipertahankan bila ada */
  var nikUtuh = {};
  (kartu.anggota || []).forEach(function(a){
    if(a.nik && String(a.nik).indexOf('•') < 0) nikUtuh[a.id] = a.nik;
  });
  out.anggota = anggotaDari(kartu.id).map(function(a){
    var c = {};
    for(var kk in a) if(a.hasOwnProperty(kk)) c[kk] = a[kk];
    if(nikUtuh[a.id]) c.nik = nikUtuh[a.id];
    return c;
  });
  out.jumlahJiwa = jumlahJiwa(w);
  return out;
}

/** Jendela PIN untuk warga. */

  openModal('Buka Kartu — '+esc(w.nama),

    '<form id="kpForm" autocomplete="off" onsubmit="return false">'+
      '<input class="inp" id="kpInput" type="password" inputmode="numeric" enterkeyhint="go" '+
        'maxlength="8" placeholder="••••" autocomplete="off" '+
        'style="text-align:center;font-size:26px;letter-spacing:12px;font-weight:900">'+
    '</form>'+
    '<div class="sub">PIN bawaan untuk warga baru adalah <b>1234</b>. '+
      'Setelah kartu terbuka, gantilah lewat tombol <b>Ganti PIN</b> di dalam kartu.</div>'+
    '<div class="sub" id="kpPesan" style="color:var(--red);font-weight:800"></div>',
    '<button class="btn" onclick="closeModal()">Batal</button>'+
    '<button class="btn dark" onclick="cekPinKartu(\''+jsq(w.id)+'\')">Buka Kartu</button>');

  setTimeout(function(){ pasangPinKartu(w.id); }, 80);
}

/* Tiga jalur pengiriman, sama seperti PIN pengurus: submit form untuk papan
   ketik Android, tombol Enter untuk komputer, dan pengiriman otomatis saat
   empat digit terpenuhi karena papan ketik angka iPhone tidak punya Enter. */
function pasangPinKartu(id){
  var el = $('kpInput'), fm = $('kpForm');
  if(!el) return;
  el.focus();
  if(fm) fm.addEventListener('submit', function(ev){ ev.preventDefault(); cekPinKartu(id); });
  el.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' || ev.keyCode === 13){ ev.preventDefault(); cekPinKartu(id); }
  });
  el.addEventListener('input', function(){
    if(String(el.value||'').length === 4){
      clearTimeout(el._t);
      el._t = setTimeout(function(){ cekPinKartu(id); }, 260);
    }
  });
}

var _kartuSibuk = false;

function cekPinKartu(id){
  var el = $('kpInput');
  if(!el || _kartuSibuk) return;
  var pin = String(el.value||'');
  if(!pin.length) return;

  if(!S.online){
    setPesanKartu('Membuka kartu pertama kali memerlukan koneksi internet. '+
                  'Setelah itu kartu tersimpan di HP ini dan bisa dibuka luring.');
    return;
  }

  _kartuSibuk = true;
  var tombol = document.querySelector('.mf .btn.dark');
  if(tombol) tombol.disabled = true;

  callServer('kartu_buka', {wargaId:id, pin:pin}).then(function(data){
    _kartuSibuk = false;
    simpanKartu(data);
    closeModal();
    tampilkanKartu(segarkanKartu(data));
    if(data.pinBawaan){
      toast('Kartu terbuka. Anda masih memakai PIN bawaan — sebaiknya segera diganti.','info');
    }
  }).catch(function(err){
    _kartuSibuk = false;
    var t = document.querySelector('.mf .btn.dark');
    if(t) t.disabled = false;
    var e2 = $('kpInput');
    if(e2){ e2.value=''; e2.focus(); }
    setPesanKartu(err.message);
  });
}

function setPesanKartu(teks){
  var p = $('kpPesan');
  if(p) p.textContent = teks;
  else toast(teks,'err');
}

/** Pengurus membuka kartu siapa pun memakai PIN pengurus. */
function bukaKartuPengurus(id){
  if(!S.online){
    var simpan = ambilKartu(id);
    if(simpan){ tampilkanKartu(segarkanKartu(simpan)); return; }
    toast('Membuka kartu warga lain memerlukan koneksi.','err');
    return;
  }
  mintaPinPengurusLalu(function(pinP){
    callServer('kartu_buka', {wargaId:id, pinPengurus:pinP}).then(function(data){
      closeModal();
      tampilkanKartu(data);
    }).catch(function(err){ toast(err.message,'err'); });
  }, 'Buka Kartu Warga');
}

 * PIN pengurus tidak disimpan permanen. Bila sudah dimasukkan pada sesi ini,
 * langsung dipakai; bila belum, ditanyakan sekali lalu diingat di memori saja.
 */
var _pinPengurusSesi = '';

function mintaPinPengurusLalu(lanjut, judul){
  if(_pinPengurusSesi){ lanjut(_pinPengurusSesi); return; }
  openModal(judul || 'Konfirmasi PIN Pengurus',
    '<div class="sub">Masukkan PIN pengurus untuk melanjutkan. '+
      'PIN hanya disimpan sementara selama aplikasi terbuka.</div>'+
    '<form id="ppForm" autocomplete="off" onsubmit="return false">'+
      '<input class="inp" id="ppInput" type="password" inputmode="numeric" enterkeyhint="go" '+
        'maxlength="8" placeholder="••••" autocomplete="off" '+
        'style="text-align:center;font-size:26px;letter-spacing:12px;font-weight:900">'+
    '</form>',
    '<button class="btn" onclick="closeModal()">Batal</button>'+
    '<button class="btn dark" onclick="kirimPinPengurus()">Lanjut</button>');

  _lanjutPinPengurus = lanjut;
  setTimeout(function(){
    var el = $('ppInput'), fm = $('ppForm');
    if(!el) return;
    el.focus();
    if(fm) fm.addEventListener('submit', function(ev){ ev.preventDefault(); kirimPinPengurus(); });
    el.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter' || ev.keyCode === 13){ ev.preventDefault(); kirimPinPengurus(); }
    });
  }, 80);
}

var _lanjutPinPengurus = null;

function kirimPinPengurus(){
  var el = $('ppInput');
  if(!el) return;
  var pin = String(el.value||'');
  if(!pin.length) return;
  _pinPengurusSesi = pin;
  var f = _lanjutPinPengurus;
  _lanjutPinPengurus = null;
  if(f) f(pin);
}

/**

    '<div class="spread"><b style="font-size:12px">👪 ANGGOTA KELUARGA</b>'+

    return h + '<div class="sub" style="margin-top:6px">Belum ada anggota keluarga yang didata. '+
      'Hubungi pengurus RT untuk melengkapinya.</div></div>';
