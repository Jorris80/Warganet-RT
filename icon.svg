<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WargaNet RT RW" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="512" height="512" fill="#111111"/>
  <rect x="34" y="34" width="444" height="444" fill="#fde047" stroke="#000000" stroke-width="16"/>

  <!-- deretan rumah warga -->
  <g stroke="#000000" stroke-width="14" stroke-linejoin="round">
    <polygon points="128,236 188,186 248,236" fill="#ffffff"/>
    <rect x="146" y="236" width="84" height="86" fill="#ffffff"/>
    <rect x="172" y="272" width="32" height="50" fill="#3b82f6"/>

    <polygon points="264,236 324,186 384,236" fill="#ffffff"/>
    <rect x="282" y="236" width="84" height="86" fill="#ffffff"/>
    <rect x="308" y="272" width="32" height="50" fill="#3b82f6"/>
  </g>

  <!-- garis jalan lingkungan -->
  <rect x="110" y="342" width="292" height="18" fill="#111111"/>
  <g fill="#fde047">
    <rect x="132" y="348" width="30" height="6"/>
    <rect x="192" y="348" width="30" height="6"/>
    <rect x="252" y="348" width="30" height="6"/>
    <rect x="312" y="348" width="30" height="6"/>
  </g>

  <!-- simpul jaringan warga -->
  <g stroke="#000000" stroke-width="12">
    <line x1="188" y1="150" x2="256" y2="112"/>
    <line x1="324" y1="150" x2="256" y2="112"/>
  </g>
  <g stroke="#000000" stroke-width="12">
    <circle cx="256" cy="112" r="34" fill="#ef4444"/>
    <circle cx="188" cy="150" r="20" fill="#ffffff"/>
    <circle cx="324" cy="150" r="20" fill="#ffffff"/>
  </g>

  <text x="256" y="428" font-family="Helvetica, Arial, sans-serif" font-size="62"
        font-weight="bold" text-anchor="middle" fill="#111111" letter-spacing="4">WARGANET</text>
</svg>
